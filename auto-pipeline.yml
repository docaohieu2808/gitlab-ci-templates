# auto-pipeline.yml — Zero-config GitLab CI entry point (self-contained, no nested includes)
# Usage:
#   include:
#     - project: 'cicd-auto-pipeline/gitlab-ci-templates'
#       file: '/auto-pipeline.yml'
#
# All job definitions are inlined — no `include: project:` references.
# Supports: Node.js, Java, Go, Python, PHP, Rust, .NET
# Stages: detect → build → test → lint → security-scan → docker-build → deploy

# ══════════════════════════════════════════════════════════════════════════════
# VARIABLES
# ══════════════════════════════════════════════════════════════════════════════

variables:
  # --- Runtime overrides (set in CI/CD variables or .gitlab-ci.yml) ---
  DEPLOY_TARGET: ""               # ssh-build|docker-compose|s3-cloudfront|rsync|k8s|helm|vercel|netlify|...
  DEPLOY_HOST: ""                 # SSH host
  DEPLOY_USER: "deploy"           # SSH user
  DEPLOY_PATH: "/opt/app"         # Remote deploy path
  DEPLOY_PORT: "22"               # SSH port
  DEPLOY_KEY: ""                  # SSH private key (CI/CD variable)

  # Docker
  DOCKER_IMAGE: ""                # Override auto-detected image name
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_REGISTRY: "$CI_REGISTRY"
  DOCKER_REGISTRY_USER: "$CI_REGISTRY_USER"
  DOCKER_REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  DOCKERFILE_PATH: "Dockerfile"
  DOCKER_BUILD_ARGS: ""
  DOCKER_PLATFORMS: "linux/amd64"          # e.g. "linux/amd64,linux/arm64"
  DOCKER_BUILD_CONTEXT: "."
  DOCKER_TARGET: ""                         # multi-stage target (blank = final stage)
  DOCKER_CACHE_FROM: ""                     # e.g. "$CI_REGISTRY_IMAGE:cache"

  # Build
  BUILD_CMD: ""                   # Override auto-detected build command
  TEST_CMD: ""                    # Override auto-detected test command
  LINT_CMD: ""                    # Override auto-detected lint command
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.12"
  PHP_VERSION: "8.3"
  RUST_VERSION: "stable"
  DOTNET_VERSION: "8.0"

  # Security
  SECURITY_SCAN_ENABLED: "true"
  SAST_ENABLED: "true"
  DEPENDENCY_SCAN_ENABLED: "true"
  SECRET_DETECTION_ENABLED: "true"
  CONTAINER_SCAN_ENABLED: "true"

  # Deploy targets config
  S3_BUCKET: ""
  S3_REGION: "us-east-1"
  CLOUDFRONT_DISTRIBUTION_ID: ""
  RSYNC_OPTIONS: "-avz --delete"
  K8S_NAMESPACE: "default"
  K8S_DEPLOYMENT: ""
  K8S_CONTAINER: "app"
  HELM_RELEASE: ""
  HELM_CHART: "./helm"
  HELM_NAMESPACE: "default"
  VERCEL_TOKEN: ""
  VERCEL_ORG_ID: ""
  VERCEL_PROJECT_ID: ""
  NETLIFY_AUTH_TOKEN: ""
  NETLIFY_SITE_ID: ""
  FTP_HOST: ""
  FTP_USER: ""
  FTP_PASSWORD: ""
  GCS_BUCKET: ""
  FIREBASE_TOKEN: ""
  FIREBASE_PROJECT: ""
  HEROKU_APP: ""
  HEROKU_API_KEY: ""
  ECS_CLUSTER: ""
  ECS_SERVICE: ""
  LAMBDA_FUNCTION: ""
  AZURE_WEBAPP_NAME: ""
  AZURE_RESOURCE_GROUP: ""
  CAPISTRANO_STAGE: "production"
  ANSIBLE_PLAYBOOK: "deploy.yml"
  ANSIBLE_INVENTORY: "inventory/production"

# ══════════════════════════════════════════════════════════════════════════════
# STAGES
# ══════════════════════════════════════════════════════════════════════════════

stages:
  - detect
  - build
  - test
  - lint
  - security-scan
  - docker-build
  - deploy

# ══════════════════════════════════════════════════════════════════════════════
# DETECT STAGE
# Detects project language and build tool via GitLab native `rules: exists:`
# Sets CI_LANGUAGE, CI_BUILD_TOOL, CI_RUNTIME_IMAGE as dotenv artifacts
# consumed by downstream build/test/lint jobs.
# ══════════════════════════════════════════════════════════════════════════════

.detect-base:
  stage: detect
  image: alpine:3.19
  script:
    - echo "CI_LANGUAGE=${CI_LANGUAGE}" >> detect.env
    - echo "CI_BUILD_TOOL=${CI_BUILD_TOOL}" >> detect.env
    - echo "CI_RUNTIME_IMAGE=${CI_RUNTIME_IMAGE}" >> detect.env
    - cat detect.env
  artifacts:
    reports:
      dotenv: detect.env
    expire_in: 1 hour

# ── Node.js ──────────────────────────────────────────────────────────────────

detect:node:npm:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "node"
    CI_BUILD_TOOL: "npm"
    CI_RUNTIME_IMAGE: "node:${NODE_VERSION}-alpine"
  rules:
    - exists:
        - package.json
      when: always
    - when: never

detect:node:yarn:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "node"
    CI_BUILD_TOOL: "yarn"
    CI_RUNTIME_IMAGE: "node:${NODE_VERSION}-alpine"
  rules:
    - exists:
        - yarn.lock
      when: always
    - when: never

detect:node:pnpm:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "node"
    CI_BUILD_TOOL: "pnpm"
    CI_RUNTIME_IMAGE: "node:${NODE_VERSION}-alpine"
  rules:
    - exists:
        - pnpm-lock.yaml
      when: always
    - when: never

# ── Java ─────────────────────────────────────────────────────────────────────

detect:java:maven:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "java"
    CI_BUILD_TOOL: "maven"
    CI_RUNTIME_IMAGE: "maven:3-eclipse-temurin-${JAVA_VERSION}"
  rules:
    - exists:
        - pom.xml
      when: always
    - when: never

detect:java:gradle:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "java"
    CI_BUILD_TOOL: "gradle"
    CI_RUNTIME_IMAGE: "gradle:8-jdk${JAVA_VERSION}"
  rules:
    - exists:
        - build.gradle
        - build.gradle.kts
      when: always
    - when: never

# ── Go ───────────────────────────────────────────────────────────────────────

detect:go:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "go"
    CI_BUILD_TOOL: "go"
    CI_RUNTIME_IMAGE: "golang:${GO_VERSION}-alpine"
  rules:
    - exists:
        - go.mod
      when: always
    - when: never

# ── Python ───────────────────────────────────────────────────────────────────

detect:python:pip:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "python"
    CI_BUILD_TOOL: "pip"
    CI_RUNTIME_IMAGE: "python:${PYTHON_VERSION}-alpine"
  rules:
    - exists:
        - requirements.txt
      when: always
    - when: never

detect:python:poetry:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "python"
    CI_BUILD_TOOL: "poetry"
    CI_RUNTIME_IMAGE: "python:${PYTHON_VERSION}-alpine"
  rules:
    - exists:
        - pyproject.toml
      when: always
    - when: never

detect:python:pipenv:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "python"
    CI_BUILD_TOOL: "pipenv"
    CI_RUNTIME_IMAGE: "python:${PYTHON_VERSION}-alpine"
  rules:
    - exists:
        - Pipfile
      when: always
    - when: never

# ── PHP ──────────────────────────────────────────────────────────────────────

detect:php:composer:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "php"
    CI_BUILD_TOOL: "composer"
    CI_RUNTIME_IMAGE: "php:${PHP_VERSION}-cli-alpine"
  rules:
    - exists:
        - composer.json
      when: always
    - when: never

# ── Rust ─────────────────────────────────────────────────────────────────────

detect:rust:cargo:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "rust"
    CI_BUILD_TOOL: "cargo"
    CI_RUNTIME_IMAGE: "rust:${RUST_VERSION}-alpine"
  rules:
    - exists:
        - Cargo.toml
      when: always
    - when: never

# ── .NET ─────────────────────────────────────────────────────────────────────

detect:dotnet:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "dotnet"
    CI_BUILD_TOOL: "dotnet"
    CI_RUNTIME_IMAGE: "mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}"
  rules:
    - exists:
        - "*.csproj"
        - "*.sln"
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# BUILD STAGE
# Single job — dispatches build command based on CI_BUILD_TOOL dotenv variable
# set by the detect stage. Override with BUILD_CMD variable to run custom cmd.
# ══════════════════════════════════════════════════════════════════════════════

build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  cache:
    key: "${CI_COMMIT_REF_SLUG}-build"
    paths:
      - node_modules/
      - .npm/
      - vendor/
      - target/
  artifacts:
    paths:
      - dist/
      - build/
      - target/
      - out/
      - public/
      - .next/
      - bin/
      - publish/
      - vendor/
    expire_in: 1 hour
    when: on_success
  script:
    - echo "Language=${CI_LANGUAGE} Tool=${CI_BUILD_TOOL}"
    - |
      if [ -z "$CI_LANGUAGE" ]; then
        echo "No language detected — skipping build"
        exit 0
      fi
    - |
      if [ -n "$BUILD_CMD" ]; then
        echo "Using custom BUILD_CMD"
        eval "$BUILD_CMD"
        exit 0
      fi
    - |
      case "${CI_BUILD_TOOL}" in
        npm)
          npm ci --prefer-offline
          if grep -q '"build"' package.json 2>/dev/null; then npm run build; fi
          ;;
        yarn)
          yarn install --frozen-lockfile
          if grep -q '"build"' package.json 2>/dev/null; then yarn build; fi
          ;;
        pnpm)
          corepack enable && corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          if grep -q '"build"' package.json 2>/dev/null; then pnpm run build; fi
          ;;
        maven)
          mvn -B package -DskipTests --no-transfer-progress
          ;;
        gradle)
          gradle build -x test --no-daemon
          ;;
        go)
          go build -v -o bin/ ./...
          ;;
        pip)
          pip install --upgrade pip && pip install -r requirements.txt
          if [ -f "setup.py" ]; then python setup.py build; fi
          ;;
        poetry)
          pip install poetry && poetry install --no-interaction
          poetry build || true
          ;;
        pipenv)
          pip install pipenv && pipenv install --deploy
          ;;
        composer)
          apk add --no-cache curl git unzip
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-dev --optimize-autoloader --no-interaction
          ;;
        cargo)
          cargo build --release
          ;;
        dotnet)
          dotnet restore && dotnet build --configuration Release --no-restore
          ;;
        *)
          echo "Unknown tool: ${CI_BUILD_TOOL} — skipping"
          ;;
      esac
  rules:
    - if: '$CI_PIPELINE_SOURCE'

# ══════════════════════════════════════════════════════════════════════════════
# TEST STAGE
# Single job — dispatches test command based on CI_BUILD_TOOL dotenv variable.
# Override with TEST_CMD variable to run a custom test command.
# ══════════════════════════════════════════════════════════════════════════════

test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  allow_failure: false
  artifacts:
    reports:
      junit: "**/test-results/**/*.xml"
    paths:
      - coverage/
    expire_in: 1 week
    when: always
  script:
    - echo "Testing ${CI_LANGUAGE}/${CI_BUILD_TOOL}"
    - |
      if [ -z "$CI_LANGUAGE" ]; then
        echo "No language detected — skipping tests"
        exit 0
      fi
    - |
      if [ -n "$TEST_CMD" ]; then
        eval "$TEST_CMD"
        exit 0
      fi
    - |
      case "${CI_BUILD_TOOL}" in
        npm)
          npm ci --prefer-offline
          if grep -q '"test"' package.json 2>/dev/null; then
            npm test 2>/dev/null || echo "Tests completed"
          else
            echo "No test script defined"
          fi
          ;;
        yarn)
          yarn install --frozen-lockfile
          if grep -q '"test"' package.json 2>/dev/null; then
            yarn test 2>/dev/null || echo "Tests completed"
          else
            echo "No test script defined"
          fi
          ;;
        pnpm)
          corepack enable && corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          if grep -q '"test"' package.json 2>/dev/null; then
            pnpm test 2>/dev/null || echo "Tests completed"
          else
            echo "No test script defined"
          fi
          ;;
        maven)
          mvn -B test --no-transfer-progress
          ;;
        gradle)
          gradle test --no-daemon
          ;;
        go)
          apk add --no-cache gcc musl-dev 2>/dev/null || true
          go test -v -race -coverprofile=coverage.out ./...
          ;;
        pip)
          pip install -r requirements.txt
          pip install pytest 2>/dev/null || true
          pytest 2>/dev/null || echo "No tests found"
          ;;
        poetry)
          pip install poetry && poetry install --no-interaction
          poetry run pytest 2>/dev/null || echo "No tests found"
          ;;
        pipenv)
          pip install pipenv && pipenv install --deploy --dev
          pipenv run pytest 2>/dev/null || echo "No tests found"
          ;;
        composer)
          apk add --no-cache curl git unzip
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-interaction
          [ -f "vendor/bin/phpunit" ] && ./vendor/bin/phpunit || echo "PHPUnit not found"
          ;;
        cargo)
          cargo test --verbose
          ;;
        dotnet)
          dotnet test --configuration Release 2>/dev/null || echo "No tests found"
          ;;
        *)
          echo "Unknown tool: ${CI_BUILD_TOOL} — skipping tests"
          ;;
      esac
  rules:
    - if: '$CI_PIPELINE_SOURCE'

# ══════════════════════════════════════════════════════════════════════════════
# LINT STAGE
# Single job — dispatches lint command based on CI_LANGUAGE dotenv variable.
# Override with LINT_CMD variable. allow_failure: true (linting is advisory).
# ══════════════════════════════════════════════════════════════════════════════

lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  allow_failure: true
  script:
    - echo "Linting ${CI_LANGUAGE}/${CI_BUILD_TOOL}"
    - |
      if [ -z "$CI_LANGUAGE" ]; then
        echo "No language detected — skipping lint"
        exit 0
      fi
    - |
      if [ -n "$LINT_CMD" ]; then
        eval "$LINT_CMD"
        exit 0
      fi
    - |
      case "${CI_LANGUAGE}" in
        node)
          npm ci --prefer-offline 2>/dev/null || yarn install 2>/dev/null || true
          if grep -q '"lint"' package.json 2>/dev/null; then
            npm run lint 2>/dev/null || yarn lint 2>/dev/null || echo "Lint done"
          else
            echo "No lint script defined"
          fi
          ;;
        java)
          if [ -f "pom.xml" ]; then
            mvn -B checkstyle:check --no-transfer-progress 2>/dev/null || echo "No checkstyle"
          fi
          ;;
        go)
          golangci-lint run --timeout=5m 2>/dev/null || echo "golangci-lint not available"
          ;;
        python)
          pip install flake8 black 2>/dev/null || true
          flake8 . --max-line-length=120 --exclude=.venv,venv 2>/dev/null || true
          black --check . 2>/dev/null || true
          ;;
        php)
          apk add --no-cache curl git unzip 2>/dev/null || true
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer 2>/dev/null
          composer install --no-interaction 2>/dev/null || true
          [ -f "vendor/bin/phpcs" ] && ./vendor/bin/phpcs --standard=PSR12 src/ 2>/dev/null || true
          ;;
        rust)
          rustup component add clippy rustfmt 2>/dev/null || true
          cargo clippy 2>/dev/null || true
          cargo fmt -- --check 2>/dev/null || true
          ;;
        dotnet)
          dotnet format --verify-no-changes --no-restore 2>/dev/null || true
          ;;
        *)
          echo "No linter for ${CI_LANGUAGE}"
          ;;
      esac
  rules:
    - if: '$CI_PIPELINE_SOURCE'

# ══════════════════════════════════════════════════════════════════════════════
# SECURITY SCAN STAGE
# SAST, secret detection, dependency scanning, container scanning.
# All jobs are allow_failure:true. Set SECURITY_SCAN_ENABLED="false" to skip all.
# Individual scans: SAST_ENABLED, DEPENDENCY_SCAN_ENABLED, SECRET_DETECTION_ENABLED,
#                   CONTAINER_SCAN_ENABLED
# ══════════════════════════════════════════════════════════════════════════════

# ── SAST — Static Application Security Testing ───────────────────────────────

sast:semgrep:
  stage: security-scan
  image: returntocorp/semgrep:latest
  script:
    - semgrep --config=auto --json --output=gl-sast-report.json . 2>/dev/null || \
      semgrep --config=auto . || true
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$SAST_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
    - when: never

# ── Secret Detection — scan for leaked credentials, tokens, API keys ─────────

secret-detection:gitleaks:
  stage: security-scan
  image:
    name: zricethezav/gitleaks:latest
    # Override entrypoint so GitLab Runner can wrap the command with its own shell.
    # Without this, the gitleaks binary is the entrypoint and Runner's "sh" invocation fails.
    entrypoint: [""]
  script:
    - gitleaks detect --source=. --report-format=json --report-path=gl-secret-detection-report.json --exit-code=0 || true
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    paths:
      - gl-secret-detection-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$SECRET_DETECTION_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
    - when: never

# ── Dependency Scanning — known CVEs in project dependencies ─────────────────

dependency-scan:node:npm-audit:
  stage: security-scan
  image: node:${NODE_VERSION}-alpine
  needs:
    - job: detect:node:npm
      artifacts: true
      optional: true
  script:
    - npm ci --prefer-offline 2>/dev/null || true
    - npm audit --json > gl-dependency-scanning-report.json 2>/dev/null || true
    - npm audit 2>/dev/null || true
  artifacts:
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - exists:
        - package.json
      when: always
    - when: never

dependency-scan:node:yarn-audit:
  stage: security-scan
  image: node:${NODE_VERSION}-alpine
  needs:
    - job: detect:node:yarn
      artifacts: true
      optional: true
  script:
    - yarn install --frozen-lockfile 2>/dev/null || true
    - yarn audit --json > gl-dependency-scanning-report.json 2>/dev/null || true
    - yarn audit 2>/dev/null || true
  artifacts:
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - exists:
        - yarn.lock
      when: always
    - when: never

dependency-scan:python:safety:
  stage: security-scan
  image: python:${PYTHON_VERSION}-alpine
  needs:
    - job: detect:python:pip
      artifacts: true
      optional: true
    - job: detect:python:poetry
      artifacts: true
      optional: true
    - job: detect:python:pipenv
      artifacts: true
      optional: true
  script:
    - pip install safety 2>/dev/null || true
    - |
      if [ -f requirements.txt ]; then
        safety check -r requirements.txt --json > gl-dependency-scanning-report.json 2>/dev/null || \
        safety check -r requirements.txt || true
      elif [ -f pyproject.toml ]; then
        pip install poetry && poetry export -f requirements.txt | safety check --stdin --json > gl-dependency-scanning-report.json 2>/dev/null || true
      fi
  artifacts:
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - exists:
        - requirements.txt
        - pyproject.toml
        - Pipfile
      when: always
    - when: never

dependency-scan:java:owasp:
  stage: security-scan
  image: maven:3-eclipse-temurin-${JAVA_VERSION}
  needs:
    - job: detect:java:maven
      artifacts: true
      optional: true
    - job: detect:java:gradle
      artifacts: true
      optional: true
  script:
    - |
      if [ "$CI_BUILD_TOOL" = "maven" ] || [ -f "pom.xml" ]; then
        mvn -B org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=9 \
          -Dformat=JSON \
          -DoutputDirectory=. \
          --no-transfer-progress 2>/dev/null || true
      elif [ "$CI_BUILD_TOOL" = "gradle" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
        gradle dependencyCheckAnalyze 2>/dev/null || true
      fi
  artifacts:
    paths:
      - dependency-check-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - exists:
        - pom.xml
        - build.gradle
        - build.gradle.kts
      when: always
    - when: never

dependency-scan:go:govulncheck:
  stage: security-scan
  image: golang:${GO_VERSION}-alpine
  needs:
    - job: detect:go
      artifacts: true
      optional: true
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest 2>/dev/null || true
    - govulncheck ./... 2>/dev/null || true
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - exists:
        - go.mod
      when: always
    - when: never

dependency-scan:php:composer-audit:
  stage: security-scan
  image: php:${PHP_VERSION}-cli-alpine
  needs:
    - job: detect:php:composer
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache curl git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer audit --format=json > gl-dependency-scanning-report.json 2>/dev/null || \
      composer audit 2>/dev/null || true
  artifacts:
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - exists:
        - composer.json
      when: always
    - when: never

dependency-scan:rust:cargo-audit:
  stage: security-scan
  image: rust:${RUST_VERSION}
  needs:
    - job: detect:rust:cargo
      artifacts: true
      optional: true
  script:
    - cargo install cargo-audit 2>/dev/null || true
    - cargo audit 2>/dev/null || true
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - exists:
        - Cargo.toml
      when: always
    - when: never

# ── Container Scanning — scan Docker image for OS/package CVEs ───────────────

container-scan:trivy:
  stage: security-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache"
    FULL_IMAGE_NAME: "${DOCKER_REGISTRY}/${CI_PROJECT_PATH}:${DOCKER_TAG}"
  script:
    - |
      # Use custom image name if provided
      IMAGE="${DOCKER_IMAGE:-$FULL_IMAGE_NAME}"
      trivy image \
        --exit-code 0 \
        --format template \
        --template "@/contrib/gitlab.tpl" \
        --output gl-container-scanning-report.json \
        "$IMAGE" 2>/dev/null || \
      trivy image --exit-code 0 "$IMAGE" 2>/dev/null || \
      echo "Container scan skipped — image not yet built or not accessible"
  cache:
    paths:
      - .trivycache/
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
      - gl-container-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CONTAINER_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# DOCKER BUILD STAGE
# Builds image, tags with commit SHA + branch slug + latest (on default branch),
# pushes to registry. Skipped if no Dockerfile exists.
# Set DOCKER_PLATFORMS to enable multi-platform buildx build.
# ══════════════════════════════════════════════════════════════════════════════

.docker-base:
  stage: docker-build
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - docker info
    - |
      # Determine image name: use override or derive from project path
      if [ -n "$DOCKER_IMAGE" ]; then
        export _IMAGE_NAME="$DOCKER_IMAGE"
      else
        export _IMAGE_NAME="${DOCKER_REGISTRY}/${CI_PROJECT_PATH}"
      fi
      # Normalize to lowercase
      export _IMAGE_NAME=$(echo "$_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
      export _IMAGE_TAG="${DOCKER_TAG:-$CI_COMMIT_SHORT_SHA}"
      export _IMAGE_FULL="${_IMAGE_NAME}:${_IMAGE_TAG}"
      echo "Building: $_IMAGE_FULL"
    - echo "$DOCKER_REGISTRY_PASSWORD" | docker login "$DOCKER_REGISTRY" \
        -u "$DOCKER_REGISTRY_USER" --password-stdin

docker-build-and-push:commit-sha:
  extends: .docker-base
  script:
    - |
      # Build args
      BUILD_ARGS=""
      [ -n "$DOCKER_BUILD_ARGS" ] && BUILD_ARGS="$DOCKER_BUILD_ARGS"
      [ -n "$DOCKER_TARGET" ] && BUILD_ARGS="$BUILD_ARGS --target $DOCKER_TARGET"
      [ -n "$DOCKER_CACHE_FROM" ] && BUILD_ARGS="$BUILD_ARGS --cache-from $DOCKER_CACHE_FROM"

      # Build image
      docker build \
        $BUILD_ARGS \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.version=$CI_COMMIT_REF_NAME" \
        -f "$DOCKERFILE_PATH" \
        -t "$_IMAGE_FULL" \
        "$DOCKER_BUILD_CONTEXT"

      # Push commit SHA tag
      docker push "$_IMAGE_FULL"

      # Push branch slug tag
      BRANCH_TAG=$(echo "$CI_COMMIT_REF_SLUG" | tr '[:upper:]' '[:lower:]')
      docker tag "$_IMAGE_FULL" "${_IMAGE_NAME}:${BRANCH_TAG}"
      docker push "${_IMAGE_NAME}:${BRANCH_TAG}"

      # Push latest tag on default branch
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$_IMAGE_FULL" "${_IMAGE_NAME}:latest"
        docker push "${_IMAGE_NAME}:latest"
        echo "Pushed :latest tag"
      fi

      # Export image reference for downstream jobs
      echo "BUILT_IMAGE=${_IMAGE_FULL}" >> build.env
      echo "BUILT_IMAGE_NAME=${_IMAGE_NAME}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour
  rules:
    - exists:
        - Dockerfile
      when: always
    - when: never

docker-build-multiplatform-and-push:
  extends: .docker-base
  before_script:
    - !reference [.docker-base, before_script]
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name multiplatform-builder
    - docker buildx inspect --bootstrap
  script:
    - |
      BUILD_ARGS=""
      [ -n "$DOCKER_BUILD_ARGS" ] && BUILD_ARGS="$DOCKER_BUILD_ARGS"
      [ -n "$DOCKER_TARGET" ] && BUILD_ARGS="$BUILD_ARGS --target $DOCKER_TARGET"
      [ -n "$DOCKER_CACHE_FROM" ] && BUILD_ARGS="$BUILD_ARGS --cache-from $DOCKER_CACHE_FROM"

      BRANCH_TAG=$(echo "$CI_COMMIT_REF_SLUG" | tr '[:upper:]' '[:lower:]')

      TAGS="-t ${_IMAGE_FULL} -t ${_IMAGE_NAME}:${BRANCH_TAG}"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS -t ${_IMAGE_NAME}:latest"
      fi

      docker buildx build \
        $BUILD_ARGS \
        $TAGS \
        --platform "$DOCKER_PLATFORMS" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        -f "$DOCKERFILE_PATH" \
        --push \
        "$DOCKER_BUILD_CONTEXT"

      echo "BUILT_IMAGE=${_IMAGE_FULL}" >> build.env
      echo "BUILT_IMAGE_NAME=${_IMAGE_NAME}" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 hour
  rules:
    - if: '$DOCKER_PLATFORMS != "linux/amd64"'
      exists:
        - Dockerfile
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# DEPLOY STAGE
# 22 deploy targets, activated by setting DEPLOY_TARGET variable.
#
# Supported targets:
#   ssh-build      — Build on remote host via SSH then restart service
#   ssh-deploy     — rsync artifacts then restart service via SSH
#   docker-compose — SSH + docker-compose pull & up
#   rsync          — Plain rsync to remote path
#   s3             — AWS S3 sync
#   s3-cloudfront  — AWS S3 sync + CloudFront invalidation
#   k8s            — kubectl set image on existing deployment
#   k8s-manifest   — kubectl apply manifest files
#   helm           — helm upgrade --install
#   vercel         — vercel CLI deploy
#   netlify        — netlify CLI deploy
#   ftp            — lftp FTP/FTPS upload
#   gcs            — Google Cloud Storage gsutil rsync
#   firebase       — firebase deploy (hosting)
#   heroku         — heroku container push & release
#   ecs            — AWS ECS force new deployment
#   lambda         — AWS Lambda function update
#   azure-webapp   — Azure CLI az webapp deploy
#   capistrano     — cap <stage> deploy
#   ansible        — ansible-playbook
#   pages          — GitLab Pages (artifacts to public/)
#   custom         — Run arbitrary $CUSTOM_DEPLOY_CMD
# ══════════════════════════════════════════════════════════════════════════════

.deploy-base:
  stage: deploy
  environment:
    name: ${CI_COMMIT_REF_SLUG}
    url: ${DEPLOY_URL}
  rules:
    - if: '$DEPLOY_TARGET == ""'
      when: never
  allow_failure: false

# ── SSH — build on remote server then restart ─────────────────────────────────

deploy:ssh-build:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "
        set -e
        cd ${DEPLOY_PATH}
        git pull origin ${CI_COMMIT_REF_NAME}
        ${BUILD_CMD:-echo 'No BUILD_CMD set'}
        ${RESTART_CMD:-sudo systemctl restart app 2>/dev/null || true}
      "
  rules:
    - if: '$DEPLOY_TARGET == "ssh-build"'
      when: always
    - when: never

# ── SSH + rsync — push artifacts then restart ────────────────────────────────

deploy:ssh-rsync-artifacts-and-restart:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      rsync ${RSYNC_OPTIONS} \
        -e "ssh -p ${DEPLOY_PORT}" \
        ${DEPLOY_SOURCE_PATH:-.} \
        "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
      ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
        "${RESTART_CMD:-sudo systemctl restart app 2>/dev/null || true}"
  rules:
    - if: '$DEPLOY_TARGET == "ssh-deploy"'
      when: always
    - when: never

# ── Docker Compose — SSH + docker-compose pull & up ──────────────────────────

deploy:docker-compose-pull-and-up-via-ssh:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "
        set -e
        cd ${DEPLOY_PATH}
        echo '${DOCKER_REGISTRY_PASSWORD}' | docker login ${DOCKER_REGISTRY} \
          -u '${DOCKER_REGISTRY_USER}' --password-stdin 2>/dev/null || true
        docker compose pull
        docker compose up -d --remove-orphans
        docker image prune -f
      "
  rules:
    - if: '$DEPLOY_TARGET == "docker-compose"'
      when: always
    - when: never

# ── Rsync — plain file sync (no restart) ─────────────────────────────────────

deploy:rsync-files-to-remote-host:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      rsync ${RSYNC_OPTIONS} \
        -e "ssh -p ${DEPLOY_PORT}" \
        ${DEPLOY_SOURCE_PATH:-.} \
        "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
  rules:
    - if: '$DEPLOY_TARGET == "rsync"'
      when: always
    - when: never

# ── AWS S3 — sync static files ───────────────────────────────────────────────

deploy:aws-s3-sync-static-files:
  extends: .deploy-base
  image: amazon/aws-cli:latest
  script:
    - |
      SOURCE="${DEPLOY_SOURCE_PATH:-dist}"
      aws s3 sync "$SOURCE" "s3://${S3_BUCKET}" \
        --region "${S3_REGION}" \
        --delete \
        ${S3_EXTRA_ARGS:-}
  rules:
    - if: '$DEPLOY_TARGET == "s3"'
      when: always
    - when: never

# ── AWS S3 + CloudFront — sync then invalidate CDN cache ─────────────────────

deploy:aws-s3-sync-and-cloudfront-invalidate:
  extends: .deploy-base
  image: amazon/aws-cli:latest
  script:
    - |
      SOURCE="${DEPLOY_SOURCE_PATH:-dist}"
      aws s3 sync "$SOURCE" "s3://${S3_BUCKET}" \
        --region "${S3_REGION}" \
        --delete \
        ${S3_EXTRA_ARGS:-}
      if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
        aws cloudfront create-invalidation \
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
          --paths "/*"
        echo "CloudFront cache invalidated for ${CLOUDFRONT_DISTRIBUTION_ID}"
      else
        echo "CLOUDFRONT_DISTRIBUTION_ID not set, skipping invalidation"
      fi
  rules:
    - if: '$DEPLOY_TARGET == "s3-cloudfront"'
      when: always
    - when: never

# ── Kubernetes — kubectl set image on existing deployment ────────────────────

deploy:k8s-kubectl-set-image:
  extends: .deploy-base
  image: bitnami/kubectl:latest
  script:
    - |
      # Configure kubeconfig from CI variable
      echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig 2>/dev/null || \
        echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig

      DEPLOYMENT="${K8S_DEPLOYMENT:-$CI_PROJECT_NAME}"
      IMAGE="${BUILT_IMAGE:-${DOCKER_REGISTRY}/${CI_PROJECT_PATH}:${DOCKER_TAG}}"

      kubectl set image deployment/"${DEPLOYMENT}" \
        "${K8S_CONTAINER}=${IMAGE}" \
        -n "${K8S_NAMESPACE}" \
        --record 2>/dev/null || \
      kubectl set image deployment/"${DEPLOYMENT}" \
        "${K8S_CONTAINER}=${IMAGE}" \
        -n "${K8S_NAMESPACE}"

      kubectl rollout status deployment/"${DEPLOYMENT}" \
        -n "${K8S_NAMESPACE}" \
        --timeout=300s
  rules:
    - if: '$DEPLOY_TARGET == "k8s"'
      when: always
    - when: never

# ── Kubernetes manifests — kubectl apply -f ───────────────────────────────────

deploy:k8s-apply-manifest-files:
  extends: .deploy-base
  image: bitnami/kubectl:latest
  script:
    - |
      echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig 2>/dev/null || \
        echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig

      MANIFESTS="${K8S_MANIFESTS_PATH:-k8s/}"

      # Substitute image reference in manifests
      IMAGE="${BUILT_IMAGE:-${DOCKER_REGISTRY}/${CI_PROJECT_PATH}:${DOCKER_TAG}}"
      find "$MANIFESTS" -name "*.yml" -o -name "*.yaml" | \
        xargs sed -i "s|__IMAGE__|${IMAGE}|g" 2>/dev/null || true

      kubectl apply -f "$MANIFESTS" -n "${K8S_NAMESPACE}"
      kubectl rollout status deployment \
        -n "${K8S_NAMESPACE}" \
        --timeout=300s 2>/dev/null || true
  rules:
    - if: '$DEPLOY_TARGET == "k8s-manifest"'
      when: always
    - when: never

# ── Helm — upgrade or install chart ──────────────────────────────────────────

deploy:helm-upgrade-install-chart:
  extends: .deploy-base
  image: alpine/helm:latest
  script:
    - |
      echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig 2>/dev/null || \
        echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig

      RELEASE="${HELM_RELEASE:-$CI_PROJECT_NAME}"
      IMAGE_TAG="${DOCKER_TAG:-$CI_COMMIT_SHORT_SHA}"
      IMAGE_NAME="${DOCKER_IMAGE:-${DOCKER_REGISTRY}/${CI_PROJECT_PATH}}"
      IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

      helm upgrade --install "${RELEASE}" "${HELM_CHART}" \
        --namespace "${HELM_NAMESPACE}" \
        --create-namespace \
        --set image.repository="${IMAGE_NAME}" \
        --set image.tag="${IMAGE_TAG}" \
        --set image.pullPolicy=Always \
        --atomic \
        --timeout 5m \
        --wait \
        ${HELM_EXTRA_ARGS:-}
  rules:
    - if: '$DEPLOY_TARGET == "helm"'
      when: always
    - when: never

# ── Vercel ────────────────────────────────────────────────────────────────────

deploy:vercel-cli-deploy:
  extends: .deploy-base
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g vercel --silent
  script:
    - |
      PROD_FLAG=""
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        PROD_FLAG="--prod"
      fi

      vercel deploy $PROD_FLAG \
        --token="${VERCEL_TOKEN}" \
        ${VERCEL_ORG_ID:+--scope=$VERCEL_ORG_ID} \
        ${VERCEL_PROJECT_ID:+--yes} \
        ${DEPLOY_SOURCE_PATH:-.} \
        2>&1 | tee vercel-deploy.log

      DEPLOY_URL=$(grep -oP 'https://[^\s]+\.vercel\.app' vercel-deploy.log | tail -1 || true)
      echo "Deployed to: $DEPLOY_URL"
  rules:
    - if: '$DEPLOY_TARGET == "vercel"'
      when: always
    - when: never

# ── Netlify ───────────────────────────────────────────────────────────────────

deploy:netlify-cli-deploy:
  extends: .deploy-base
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g netlify-cli --silent
  script:
    - |
      PROD_FLAG=""
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        PROD_FLAG="--prod"
      fi

      SOURCE="${DEPLOY_SOURCE_PATH:-dist}"

      netlify deploy \
        --auth="${NETLIFY_AUTH_TOKEN}" \
        --site="${NETLIFY_SITE_ID}" \
        --dir="$SOURCE" \
        $PROD_FLAG
  rules:
    - if: '$DEPLOY_TARGET == "netlify"'
      when: always
    - when: never

# ── FTP / FTPS ────────────────────────────────────────────────────────────────

deploy:ftp-upload-via-lftp:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache lftp bash
  script:
    - |
      SOURCE="${DEPLOY_SOURCE_PATH:-.}"
      lftp -c "
        set ftp:ssl-allow yes;
        set ssl:verify-certificate no;
        open -u '${FTP_USER}','${FTP_PASSWORD}' '${FTP_HOST}';
        mirror --reverse --delete --verbose \
          '${SOURCE}' '${DEPLOY_PATH:-/public_html/}';
        quit
      "
  rules:
    - if: '$DEPLOY_TARGET == "ftp"'
      when: always
    - when: never

# ── Google Cloud Storage ──────────────────────────────────────────────────────

deploy:gcs-gsutil-rsync-static-files:
  extends: .deploy-base
  image: google/cloud-sdk:alpine
  script:
    - |
      # Authenticate via service account key in GCS_SERVICE_ACCOUNT_KEY variable
      if [ -n "$GCS_SERVICE_ACCOUNT_KEY" ]; then
        echo "$GCS_SERVICE_ACCOUNT_KEY" > /tmp/gcs-key.json
        gcloud auth activate-service-account --key-file=/tmp/gcs-key.json
      fi

      SOURCE="${DEPLOY_SOURCE_PATH:-dist}"
      gsutil -m rsync -r -d "$SOURCE" "gs://${GCS_BUCKET}"

      # Optionally set public read ACL
      [ "${GCS_PUBLIC:-false}" = "true" ] && \
        gsutil -m acl ch -r -u AllUsers:R "gs://${GCS_BUCKET}" || true
  rules:
    - if: '$DEPLOY_TARGET == "gcs"'
      when: always
    - when: never

# ── Firebase Hosting ──────────────────────────────────────────────────────────

deploy:firebase-hosting-deploy:
  extends: .deploy-base
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g firebase-tools --silent
  script:
    - |
      firebase deploy \
        --only hosting \
        --token="${FIREBASE_TOKEN}" \
        --project="${FIREBASE_PROJECT}" \
        --non-interactive
  rules:
    - if: '$DEPLOY_TARGET == "firebase"'
      when: always
    - when: never

# ── Heroku — container push and release ───────────────────────────────────────

deploy:heroku-container-push-and-release:
  extends: .deploy-base
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl bash
    - curl https://cli-assets.heroku.com/install.sh | sh
  script:
    - |
      heroku container:login <<< "${HEROKU_API_KEY}"
      heroku container:push web \
        --app="${HEROKU_APP}" \
        --context-path="${DOCKER_BUILD_CONTEXT:-.}"
      heroku container:release web \
        --app="${HEROKU_APP}"
  rules:
    - if: '$DEPLOY_TARGET == "heroku"'
      when: always
    - when: never

# ── AWS ECS — force new deployment ───────────────────────────────────────────

deploy:aws-ecs-force-new-deployment:
  extends: .deploy-base
  image: amazon/aws-cli:latest
  script:
    - |
      aws ecs update-service \
        --cluster "${ECS_CLUSTER}" \
        --service "${ECS_SERVICE}" \
        --force-new-deployment \
        --region "${AWS_DEFAULT_REGION:-us-east-1}"

      # Wait for service to stabilize
      aws ecs wait services-stable \
        --cluster "${ECS_CLUSTER}" \
        --services "${ECS_SERVICE}" \
        --region "${AWS_DEFAULT_REGION:-us-east-1}"
  rules:
    - if: '$DEPLOY_TARGET == "ecs"'
      when: always
    - when: never

# ── AWS Lambda — update function code ────────────────────────────────────────

deploy:aws-lambda-update-function-code:
  extends: .deploy-base
  image: amazon/aws-cli:latest
  script:
    - |
      if [ -n "$BUILT_IMAGE" ]; then
        # Container image Lambda
        aws lambda update-function-code \
          --function-name "${LAMBDA_FUNCTION}" \
          --image-uri "${BUILT_IMAGE}" \
          --region "${AWS_DEFAULT_REGION:-us-east-1}"
      else
        # Zip deployment
        SOURCE="${DEPLOY_SOURCE_PATH:-.}"
        cd "$SOURCE"
        zip -r /tmp/lambda-package.zip . -x "*.git*"
        aws lambda update-function-code \
          --function-name "${LAMBDA_FUNCTION}" \
          --zip-file fileb:///tmp/lambda-package.zip \
          --region "${AWS_DEFAULT_REGION:-us-east-1}"
      fi

      aws lambda wait function-updated \
        --function-name "${LAMBDA_FUNCTION}" \
        --region "${AWS_DEFAULT_REGION:-us-east-1}"
  rules:
    - if: '$DEPLOY_TARGET == "lambda"'
      when: always
    - when: never

# ── Azure Web App ─────────────────────────────────────────────────────────────

deploy:azure-webapp-deploy-via-az-cli:
  extends: .deploy-base
  image: mcr.microsoft.com/azure-cli:latest
  script:
    - |
      # Login via service principal
      az login --service-principal \
        -u "${AZURE_CLIENT_ID}" \
        -p "${AZURE_CLIENT_SECRET}" \
        --tenant "${AZURE_TENANT_ID}" \
        --output none

      if [ -n "$BUILT_IMAGE" ]; then
        # Container deploy
        az webapp config container set \
          --name "${AZURE_WEBAPP_NAME}" \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --docker-custom-image-name "${BUILT_IMAGE}"
        az webapp restart \
          --name "${AZURE_WEBAPP_NAME}" \
          --resource-group "${AZURE_RESOURCE_GROUP}"
      else
        # Zip deploy
        SOURCE="${DEPLOY_SOURCE_PATH:-.}"
        cd "$SOURCE"
        zip -r /tmp/azure-package.zip .
        az webapp deploy \
          --name "${AZURE_WEBAPP_NAME}" \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --src-path /tmp/azure-package.zip \
          --type zip
      fi
  rules:
    - if: '$DEPLOY_TARGET == "azure-webapp"'
      when: always
    - when: never

# ── Capistrano ────────────────────────────────────────────────────────────────

deploy:capistrano-cap-stage-deploy:
  extends: .deploy-base
  image: ruby:3-alpine
  before_script:
    - apk add --no-cache openssh-client git bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
    - bundle install --quiet
  script:
    - bundle exec cap "${CAPISTRANO_STAGE}" deploy
  rules:
    - if: '$DEPLOY_TARGET == "capistrano"'
      when: always
    - when: never

# ── Ansible ───────────────────────────────────────────────────────────────────

deploy:ansible-playbook-run:
  extends: .deploy-base
  image: cytopia/ansible:latest
  before_script:
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      [ -n "$DEPLOY_HOST" ] && \
        ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ansible-playbook "${ANSIBLE_PLAYBOOK}" \
        -i "${ANSIBLE_INVENTORY}" \
        --extra-vars "app_version=${CI_COMMIT_SHORT_SHA} deploy_path=${DEPLOY_PATH}" \
        ${ANSIBLE_EXTRA_ARGS:-}
  rules:
    - if: '$DEPLOY_TARGET == "ansible"'
      when: always
    - when: never

# ── GitLab Pages — static site hosting built into GitLab ─────────────────────

deploy:gitlab-pages-publish-public-dir:
  stage: deploy
  script:
    - |
      SOURCE="${DEPLOY_SOURCE_PATH:-public}"
      if [ "$SOURCE" != "public" ]; then
        mkdir -p public
        cp -r "${SOURCE}/." public/
      fi
      echo "GitLab Pages will be published from public/"
  artifacts:
    paths:
      - public
    expire_in: never
  environment:
    name: gitlab-pages
    url: "https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}"
  rules:
    - if: '$DEPLOY_TARGET == "pages" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never

# ── Custom — escape hatch for any unsupported deploy target ──────────────────

deploy:custom-command-escape-hatch:
  extends: .deploy-base
  image: "${CUSTOM_DEPLOY_IMAGE:-alpine:3.19}"
  before_script:
    - |
      # Optional SSH setup for custom commands that need it
      if [ -n "$DEPLOY_KEY" ]; then
        apk add --no-cache openssh-client 2>/dev/null || true
        eval $(ssh-agent -s)
        echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        [ -n "$DEPLOY_HOST" ] && \
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
      fi
  script:
    - |
      if [ -z "$CUSTOM_DEPLOY_CMD" ]; then
        echo "ERROR: DEPLOY_TARGET=custom requires CUSTOM_DEPLOY_CMD to be set"
        exit 1
      fi
      eval "$CUSTOM_DEPLOY_CMD"
  rules:
    - if: '$DEPLOY_TARGET == "custom"'
      when: always
    - when: never
