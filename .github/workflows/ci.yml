name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Monday 03:23 UTC (10:23 Asia/Saigon): images, GitLab's schema and
    # gitlab-ci-local move even when this repo does not.
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Official CI schema that the GitLab pipeline editor uses.
  GITLAB_CI_SCHEMA_URL: https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json

jobs:
  static:
    name: yamllint, generated files, GitLab CI schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install tools
        run: |
          pip install -r tests/requirements.txt
          npm ci --prefix tests
          echo "$GITHUB_WORKSPACE/tests/node_modules/.bin" >> "$GITHUB_PATH"

      - name: yamllint
        run: yamllint .

      - name: auto-pipeline.yml and the component are in sync with jobs/
        run: python3 scripts/build-pipelines-from-fragments.py --check

      - name: Download the official GitLab CI schema
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --output "$RUNNER_TEMP/ci.json" "$GITLAB_CI_SCHEMA_URL"

      - name: Validate the pipeline files against the schema
        run: python3 tests/validate-against-gitlab-ci-schema.py "$RUNNER_TEMP/ci.json"

      - name: Validate the interpolated component and the merged auto-pipeline against the schema
        run: |
          for mode in auto-pipeline component; do
            tests/run-fixture-with-gitlab-ci-local.sh node-good "$mode" pass preview 2>/dev/null > "$RUNNER_TEMP/preview-$mode.yml"
          done
          python3 tests/validate-against-gitlab-ci-schema.py "$RUNNER_TEMP/ci.json" "$RUNNER_TEMP/preview-auto-pipeline.yml" "$RUNNER_TEMP/preview-component.yml"

      - name: No private hostnames or addresses in the tree
        run: |
          if git grep -n -I -E '(^|[^0-9.])(10\.[0-9]+\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+)([^0-9.]|$)' -- . ':!tests/package-lock.json'; then
            echo "private addresses found" >&2; exit 1
          fi

  fixtures:
    name: ${{ matrix.fixture }} via ${{ matrix.mode }} (expect ${{ matrix.expect }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [auto-pipeline, component]
        fixture: [node-good, python-good, node-bad, python-bad]
        include:
          - fixture: node-good
            expect: pass
          - fixture: python-good
            expect: pass
          - fixture: node-bad
            expect: fail
          - fixture: python-bad
            expect: fail
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install gitlab-ci-local
        run: |
          npm ci --prefix tests
          echo "$GITHUB_WORKSPACE/tests/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run the pipeline on the fixture project
        run: tests/run-fixture-with-gitlab-ci-local.sh "${{ matrix.fixture }}" "${{ matrix.mode }}" "${{ matrix.expect }}"

  monorepo:
    name: ${{ matrix.fixture }} dynamic pipeline (expect ${{ matrix.expect }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: monorepo-good
            expect: pass
          - fixture: monorepo-bad
            expect: fail
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install gitlab-ci-local
        run: |
          npm ci --prefix tests
          echo "$GITHUB_WORKSPACE/tests/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Generate and run the monorepo pipeline
        run: tests/run-monorepo-fixture-with-gitlab-ci-local.sh "${{ matrix.fixture }}" "${{ matrix.expect }}"

  security-jobs:
    name: ${{ matrix.job }} on ${{ matrix.fixture }} ${{ matrix.inject }} (expect ${{ matrix.expect }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: "secret-detection:gitleaks", fixture: node-good, inject: "", expect: pass }
          - { job: "secret-detection:gitleaks", fixture: node-good, inject: "--inject-secret", expect: fail }
          - { job: "dependency-scan:trivy", fixture: node-good, inject: "", expect: pass }
          - { job: "dependency-scan:trivy", fixture: node-vulnerable-dependency, inject: "", expect: fail }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install gitlab-ci-local
        run: |
          npm ci --prefix tests
          echo "$GITHUB_WORKSPACE/tests/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run the security job on the fixture (a secret or a vulnerable dependency must turn it red)
        run: tests/run-security-job-with-gitlab-ci-local.sh "${{ matrix.fixture }}" "${{ matrix.job }}" "${{ matrix.expect }}" ${{ matrix.inject }}

  child-deploy-pipeline:
    name: child deploy pipeline input validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install gitlab-ci-local
        run: |
          npm ci --prefix tests
          echo "$GITHUB_WORKSPACE/tests/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run validate-inputs for good and bad configurations
        run: tests/run-child-deploy-pipeline-validation-with-gitlab-ci-local.sh
