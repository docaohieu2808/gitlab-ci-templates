# Child deploy pipeline (parent-child pipelines).
#
# A parent pipeline builds and tests, then triggers this file with `trigger:include`
# and `strategy: depend`, so the parent shows the child's result. CI/CD variables of
# the parent are forwarded to the child automatically. See
# examples/parent-pipeline-triggers-deploy-child.gitlab-ci.yml for the parent side.
#
# DEPLOY_TARGET picks the deploy job: docker-compose | k8s | helm. validate-inputs
# fails the child early, with a readable message, when something required is missing.

stages:
  - validate
  - deploy
  - verify

variables:
  DEPLOY_TARGET: ""
  DEPLOY_HOST: ""
  DEPLOY_USER: "deploy"
  DEPLOY_PORT: "22"
  DEPLOY_PATH: "/opt/app"
  DEPLOY_KNOWN_HOSTS: ""
  DEPLOY_HEALTH_URL: ""
  DEPLOY_IMAGE: ""              # full image reference to roll out, e.g. registry.example.com/app:1.2.3
  K8S_NAMESPACE: "default"
  K8S_DEPLOYMENT: ""
  K8S_CONTAINER: "app"
  HELM_RELEASE: ""
  HELM_CHART: "./helm"
  HELM_NAMESPACE: "default"
  DEPLOY_TIMEOUT: "600"

child:validate-inputs:
  stage: validate
  image: alpine:3.24
  script:
    - |
      case "$DEPLOY_TARGET" in
        docker-compose) need="DEPLOY_HOST DEPLOY_KNOWN_HOSTS" ;;
        k8s)            need="DEPLOY_IMAGE K8S_DEPLOYMENT" ;;
        helm)           need="DEPLOY_IMAGE HELM_RELEASE" ;;
        *) echo "DEPLOY_TARGET must be docker-compose, k8s or helm (got '$DEPLOY_TARGET')" >&2; exit 1 ;;
      esac
      for name in $need; do
        eval "value=\${$name:-}"
        if [ -z "$value" ]; then echo "$name is required for DEPLOY_TARGET=$DEPLOY_TARGET" >&2; exit 1; fi
      done
      echo "Inputs OK for $DEPLOY_TARGET"

child:deploy-docker-compose:
  stage: deploy
  image: alpine:3.24
  resource_group: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  script:
    - |
      ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
        "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d --remove-orphans"
  rules:
    - if: '$DEPLOY_TARGET == "docker-compose"'

child:deploy-k8s:
  stage: deploy
  image:
    name: alpine/k8s:1.37.1
    entrypoint: [""]
  resource_group: production
  script:
    - kubectl set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$DEPLOY_IMAGE" -n "$K8S_NAMESPACE"
    - kubectl rollout status "deployment/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout="${DEPLOY_TIMEOUT}s"
  rules:
    - if: '$DEPLOY_TARGET == "k8s"'

child:deploy-helm:
  stage: deploy
  image:
    name: alpine/helm:4.3.1
    entrypoint: [""]
  resource_group: production
  script:
    - |
      helm upgrade --install "$HELM_RELEASE" "$HELM_CHART" \
        --namespace "$HELM_NAMESPACE" --create-namespace \
        --set "image.repository=${DEPLOY_IMAGE%:*}" --set "image.tag=${DEPLOY_IMAGE##*:}" \
        --atomic --timeout "${DEPLOY_TIMEOUT}s"
  rules:
    - if: '$DEPLOY_TARGET == "helm"'

child:verify-health:
  stage: verify
  image: alpine:3.24
  script:
    - apk add --no-cache curl
    - |
      attempt=1
      until curl --fail --silent --show-error --output /dev/null "$DEPLOY_HEALTH_URL"; do
        if [ "$attempt" -ge 10 ]; then echo "Health check failed after $attempt attempts" >&2; exit 1; fi
        attempt=$((attempt + 1))
        sleep 10
      done
      echo "Health check passed"
  rules:
    - if: '$DEPLOY_HEALTH_URL != ""'
