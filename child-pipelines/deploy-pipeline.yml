# child-pipelines/deploy-pipeline.yml — Child deploy pipeline (Level 4: Parent-Child)
# Triggered by deploy-trigger job in auto-pipeline.yml (parent).
# Receives all CI/CD variables from parent via the trigger bridge.
#
# Usage (from parent):
#   trigger:
#     include:
#       - project: 'cicd-auto-pipeline/gitlab-ci-templates'
#         file: '/child-pipelines/deploy-pipeline.yml'
#     strategy: depend

stages:
  - validate
  - deploy
  - verify

# ── Variables (inherited from parent; defaults kept for standalone use) ──────
variables:
  DEPLOY_TARGET: ""
  DEPLOY_HOST: ""
  DEPLOY_USER: "deploy"
  DEPLOY_PATH: "/opt/app"
  DEPLOY_PORT: "22"
  DEPLOY_KEY: ""
  DOCKER_IMAGE: ""
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_REGISTRY: "$CI_REGISTRY"
  K8S_NAMESPACE: "default"
  K8S_DEPLOYMENT: ""
  K8S_CONTAINER: "app"
  HELM_RELEASE: ""
  HELM_CHART: "./helm"
  HELM_NAMESPACE: "default"
  CHILD_DEPLOY_TIMEOUT: "600"

# ── Hidden base ──────────────────────────────────────────────────────────────
.child-deploy-base:
  image: alpine:3.19
  before_script:
    - echo "==> Child pipeline started"
    - echo "    DEPLOY_TARGET  = $DEPLOY_TARGET"
    - echo "    CI_ENVIRONMENT = $CI_ENVIRONMENT_NAME"
    - echo "    Triggered by   = $CI_PIPELINE_SOURCE"

# ── Stage: validate ──────────────────────────────────────────────────────────

child:validate-inputs:
  extends: .child-deploy-base
  stage: validate
  script:
    - |
      if [ -z "$DEPLOY_TARGET" ]; then
        echo "ERROR: DEPLOY_TARGET is required in child pipeline"
        exit 1
      fi
      echo "==> Validated: DEPLOY_TARGET=$DEPLOY_TARGET"
  rules:
    - when: always

# ── Stage: deploy ────────────────────────────────────────────────────────────

child:deploy-ssh:
  extends: .child-deploy-base
  stage: deploy
  script:
    - |
      apk add --no-cache openssh-client rsync
      eval $(ssh-agent -s)
      echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
      echo "==> Deploying to SSH target: $DEPLOY_HOST:$DEPLOY_PATH"
      rsync -avz --delete ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
        cd $DEPLOY_PATH
        [ -f docker-compose.yml ] && docker compose pull && docker compose up -d --remove-orphans || true
        [ -f restart.sh ] && sh restart.sh || true
      "
  rules:
    - if: '$DEPLOY_TARGET == "ssh" || $DEPLOY_TARGET == "ssh-build" || $DEPLOY_TARGET == "docker-compose"'
      when: always
    - when: never

child:deploy-k8s:
  extends: .child-deploy-base
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - |
      echo "==> Deploying to Kubernetes"
      echo "    Namespace  : $K8S_NAMESPACE"
      echo "    Deployment : $K8S_DEPLOYMENT"
      echo "    Image      : ${DOCKER_REGISTRY}/${DOCKER_IMAGE}:${DOCKER_TAG}"
      kubectl set image deployment/"$K8S_DEPLOYMENT" \
        "$K8S_CONTAINER=${DOCKER_REGISTRY}/${DOCKER_IMAGE}:${DOCKER_TAG}" \
        -n "$K8S_NAMESPACE"
      kubectl rollout status deployment/"$K8S_DEPLOYMENT" \
        -n "$K8S_NAMESPACE" \
        --timeout="${CHILD_DEPLOY_TIMEOUT}s"
  rules:
    - if: '$DEPLOY_TARGET == "k8s"'
      when: always
    - when: never

child:deploy-helm:
  extends: .child-deploy-base
  stage: deploy
  image: alpine/helm:3.14.0
  script:
    - |
      echo "==> Deploying via Helm"
      echo "    Release   : $HELM_RELEASE"
      echo "    Chart     : $HELM_CHART"
      echo "    Namespace : $HELM_NAMESPACE"
      helm upgrade --install "$HELM_RELEASE" "$HELM_CHART" \
        --namespace "$HELM_NAMESPACE" \
        --create-namespace \
        --set image.tag="$DOCKER_TAG" \
        --set image.repository="${DOCKER_REGISTRY}/${DOCKER_IMAGE}" \
        --atomic \
        --timeout "${CHILD_DEPLOY_TIMEOUT}s"
  rules:
    - if: '$DEPLOY_TARGET == "helm"'
      when: always
    - when: never

# ── Stage: verify ────────────────────────────────────────────────────────────

child:verify-deployment:
  extends: .child-deploy-base
  stage: verify
  script:
    - |
      echo "==> Post-deploy verification"
      if [ -n "$DEPLOY_HEALTH_URL" ]; then
        apk add --no-cache curl
        for i in $(seq 1 10); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_HEALTH_URL" || echo "000")
          echo "    Attempt $i: HTTP $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "==> Health check passed"
            exit 0
          fi
          sleep 10
        done
        echo "ERROR: Health check failed after 10 attempts"
        exit 1
      else
        echo "==> No DEPLOY_HEALTH_URL set — skipping health check"
      fi
  rules:
    - when: always
