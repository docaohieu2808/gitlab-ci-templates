# .gitlab-ci.yml — CI/CD Catalog release pipeline for gitlab-ci-templates repository
# Publishes the auto-detect-build-test-deploy component to the GitLab CI/CD Catalog.
# Triggered on version tags (e.g. v1.0, v1.2.3).
#
# GitLab 17+ CI/CD Catalog spec:
#   https://docs.gitlab.com/ee/ci/components/#publish-a-new-release

stages:
  - validate
  - release

variables:
  CATALOG_COMPONENT_ROOT: "templates/auto-detect-build-test-deploy"

# ── Validate component YAML before release ──────────────────────────────────

validate-catalog-component-yaml-syntax:
  stage: validate
  image: alpine:3.19
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip install yamllint --quiet
  script:
    - |
      echo "[validate] Linting all YAML files under templates/"
      yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}}}" \
        templates/auto-detect-build-test-deploy/gitlab-cicd-catalog-component-auto-detect-build-test-deploy.yml
      echo "[validate] YAML OK"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Publish to CI/CD Catalog ─────────────────────────────────────────────────
# Requires:
#   - Project marked as a catalog resource in Settings > CI/CD > Catalog
#   - Tag format: v<major>.<minor>[.<patch>]  e.g. v1.0  or  v1.2.3
#
# The `release-cli` job uses the built-in GitLab release mechanism.
# GitLab automatically indexes the component when a release is created
# from a project that is a catalog resource.

publish-cicd-catalog-component-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [validate-catalog-component-yaml-syntax]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+/'
  script:
    - echo "[release] Publishing catalog component version $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Auto-Detect Build Test Deploy — $CI_COMMIT_TAG"
    description: |
      GitLab CI/CD Catalog component: auto-detect-build-test-deploy

      Zero-config CI/CD — auto-detects Node.js, Java, Go, Python, PHP, Rust, .NET.
      Stages: detect → build → test → lint → docker → deploy.

      Usage:
        include:
          - component: git.docaohieu.com/cicd-auto-pipeline/gitlab-ci-templates/auto-detect-build-test-deploy@$CI_COMMIT_TAG
            inputs:
              deploy_target: docker-compose
    ref: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Component source"
          url: "$CI_PROJECT_URL/-/tree/$CI_COMMIT_TAG/templates/auto-detect-build-test-deploy"
          link_type: runbook
