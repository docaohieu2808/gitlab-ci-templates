# Pipeline of this repository itself, for a GitLab instance that hosts it.
# It checks the files and, on a semantic-version tag (1.0.0, no leading "v"),
# publishes a release, which is what puts the component in the CI/CD Catalog.
#
# The project must be marked as a catalog resource (Settings > General > Visibility >
# CI/CD Catalog resource) and have a description. The same checks, plus runs of the
# pipelines against fixture projects with gitlab-ci-local, run on GitHub Actions
# (.github/workflows/ci.yml); see README.md.

stages:
  - validate
  - release

validate:fragments-are-in-sync:
  stage: validate
  image: python:3.14-alpine
  script:
    - python3 scripts/build-pipelines-from-fragments.py --check
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"'

validate:yamllint:
  stage: validate
  image: python:3.14-alpine
  script:
    - pip install yamllint
    - yamllint .
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"'

release:catalog-component:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/cli:v1.124.0
    entrypoint: [""]
  needs:
    - validate:fragments-are-in-sync
    - validate:yamllint
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG of the auto-detect-build-test-deploy component and the jobs/ fragments."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
