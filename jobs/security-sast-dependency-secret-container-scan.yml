# security-sast-dependency-secret-container-scan.yml
# Security scanning stage: SAST, dependency scanning, secret detection, container scanning.
# All jobs are allow_failure:true by default — set SECURITY_SCAN_ENABLED="false" to skip entirely.
# Uses GitLab built-in security analyzers where available, falls back to open-source tools.

# ══════════════════════════════════════════════════════════════════════════════
# SAST — Static Application Security Testing
# ══════════════════════════════════════════════════════════════════════════════

sast:semgrep:
  stage: security-scan
  image: returntocorp/semgrep:latest
  script:
    - semgrep --config=auto --json --output=gl-sast-report.json . 2>/dev/null || \
      semgrep --config=auto . || true
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$SAST_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Secret Detection — scan for leaked credentials, tokens, API keys
# ══════════════════════════════════════════════════════════════════════════════

secret-detection:gitleaks:
  stage: security-scan
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source=. --report-format=json --report-path=gl-secret-detection-report.json --exit-code=0 || true
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    paths:
      - gl-secret-detection-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$SECRET_DETECTION_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Dependency Scanning — known CVEs in project dependencies
# ══════════════════════════════════════════════════════════════════════════════

dependency-scan:node:npm-audit:
  stage: security-scan
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci --prefer-offline 2>/dev/null || true
    - npm audit --json > gl-dependency-scanning-report.json 2>/dev/null || true
    - npm audit 2>/dev/null || true
  artifacts:
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_LANGUAGE == "node" && $CI_BUILD_TOOL == "npm"'
      when: always
    - when: never

dependency-scan:node:yarn-audit:
  stage: security-scan
  image: node:${NODE_VERSION}-alpine
  script:
    - yarn install --frozen-lockfile 2>/dev/null || true
    - yarn audit --json > gl-dependency-scanning-report.json 2>/dev/null || true
    - yarn audit 2>/dev/null || true
  artifacts:
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_LANGUAGE == "node" && $CI_BUILD_TOOL == "yarn"'
      when: always
    - when: never

dependency-scan:python:safety:
  stage: security-scan
  image: python:${PYTHON_VERSION}-alpine
  script:
    - pip install safety 2>/dev/null || true
    - |
      if [ -f requirements.txt ]; then
        safety check -r requirements.txt --json > gl-dependency-scanning-report.json 2>/dev/null || \
        safety check -r requirements.txt || true
      elif [ -f pyproject.toml ]; then
        pip install poetry && poetry export -f requirements.txt | safety check --stdin --json > gl-dependency-scanning-report.json 2>/dev/null || true
      fi
  artifacts:
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_LANGUAGE == "python"'
      when: always
    - when: never

dependency-scan:java:owasp:
  stage: security-scan
  image: maven:3-eclipse-temurin-${JAVA_VERSION}
  script:
    - |
      if [ "$CI_BUILD_TOOL" = "maven" ]; then
        mvn -B org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=9 \
          -Dformat=JSON \
          -DoutputDirectory=. \
          --no-transfer-progress 2>/dev/null || true
      elif [ "$CI_BUILD_TOOL" = "gradle" ]; then
        gradle dependencyCheckAnalyze 2>/dev/null || true
      fi
  artifacts:
    paths:
      - dependency-check-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_LANGUAGE == "java"'
      when: always
    - when: never

dependency-scan:go:govulncheck:
  stage: security-scan
  image: golang:${GO_VERSION}-alpine
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest 2>/dev/null || true
    - govulncheck ./... 2>/dev/null || true
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_BUILD_TOOL == "go"'
      when: always
    - when: never

dependency-scan:php:composer-audit:
  stage: security-scan
  image: php:${PHP_VERSION}-cli-alpine
  before_script:
    - apk add --no-cache curl git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer audit --format=json > gl-dependency-scanning-report.json 2>/dev/null || \
      composer audit 2>/dev/null || true
  artifacts:
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_BUILD_TOOL == "composer"'
      when: always
    - when: never

dependency-scan:rust:cargo-audit:
  stage: security-scan
  image: rust:${RUST_VERSION}
  script:
    - cargo install cargo-audit 2>/dev/null || true
    - cargo audit 2>/dev/null || true
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_BUILD_TOOL == "cargo"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Container Scanning — scan Docker image for OS/package CVEs
# ══════════════════════════════════════════════════════════════════════════════

container-scan:trivy:
  stage: security-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache"
    FULL_IMAGE_NAME: "${DOCKER_REGISTRY}/${CI_PROJECT_PATH}:${DOCKER_TAG}"
  script:
    - |
      # Use custom image name if provided
      IMAGE="${DOCKER_IMAGE:-$FULL_IMAGE_NAME}"
      trivy image \
        --exit-code 0 \
        --format template \
        --template "@/contrib/gitlab.tpl" \
        --output gl-container-scanning-report.json \
        "$IMAGE" 2>/dev/null || \
      trivy image --exit-code 0 "$IMAGE" 2>/dev/null || \
      echo "Container scan skipped — image not yet built or not accessible"
  cache:
    paths:
      - .trivycache/
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
      - gl-container-scanning-report.json
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CONTAINER_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never
