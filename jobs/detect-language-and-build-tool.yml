# detect-language-and-build-tool.yml
# Detects project language and build tool via GitLab native `rules: exists:`
# Sets CI_LANGUAGE and CI_BUILD_TOOL as dotenv artifacts consumed by downstream jobs.

.detect-base:
  stage: detect
  image: alpine:3.19
  script:
    - echo "CI_LANGUAGE=${CI_LANGUAGE}" >> detect.env
    - echo "CI_BUILD_TOOL=${CI_BUILD_TOOL}" >> detect.env
    - echo "CI_RUNTIME_IMAGE=${CI_RUNTIME_IMAGE}" >> detect.env
    - cat detect.env
  artifacts:
    reports:
      dotenv: detect.env
    expire_in: 1 hour

# ── Node.js ──────────────────────────────────────────────────────────────────
detect:node:npm:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "node"
    CI_BUILD_TOOL: "npm"
    CI_RUNTIME_IMAGE: "node:${NODE_VERSION}-alpine"
  rules:
    - exists:
        - package.json
      when: always
    - when: never

detect:node:yarn:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "node"
    CI_BUILD_TOOL: "yarn"
    CI_RUNTIME_IMAGE: "node:${NODE_VERSION}-alpine"
  rules:
    - exists:
        - yarn.lock
      when: always
    - when: never

detect:node:pnpm:
  extends: .detect-base
  variables:
    CI_LANGUAGE: "node"
    CI_BUILD_TOOL: "pnpm"
    CI_RUNTIME_IMAGE: "node:${NODE_VERSION}-alpine"
  rules:
