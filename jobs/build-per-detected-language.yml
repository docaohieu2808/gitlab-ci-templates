# build-per-detected-language.yml
# Single build job that uses detect stage dotenv output to run correct commands.
# Uses `rules: - when: on_success` so it always runs if detect succeeded.

build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  cache:
    key: "${CI_COMMIT_REF_SLUG}-build"
    paths:
      - node_modules/
      - .npm/
      - vendor/
      - target/
  artifacts:
    paths:
      - dist/
      - build/
      - target/
      - out/
      - public/
      - .next/
      - bin/
      - publish/
      - vendor/
    expire_in: 1 hour
    when: on_success
  script:
    - echo "Language=${CI_LANGUAGE} Tool=${CI_BUILD_TOOL}"
    - |
      if [ -z "$CI_LANGUAGE" ]; then
        echo "No language detected — skipping build"
        exit 0
      fi
    - |
      if [ -n "$BUILD_CMD" ]; then
        echo "Using custom BUILD_CMD"
        eval "$BUILD_CMD"
        exit 0
      fi
    - |
      case "${CI_BUILD_TOOL}" in
        npm)
          npm ci --prefer-offline
          if grep -q '"build"' package.json 2>/dev/null; then npm run build; fi
          ;;
        yarn)
          yarn install --frozen-lockfile
          if grep -q '"build"' package.json 2>/dev/null; then yarn build; fi
          ;;
        pnpm)
          corepack enable && corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          if grep -q '"build"' package.json 2>/dev/null; then pnpm run build; fi
          ;;
        maven)
          mvn -B package -DskipTests --no-transfer-progress
          ;;
        gradle)
          gradle build -x test --no-daemon
          ;;
        go)
          go build -v -o bin/ ./...
          ;;
        pip)
          pip install --upgrade pip && pip install -r requirements.txt
          if [ -f "setup.py" ]; then python setup.py build; fi
          ;;
        poetry)
          pip install poetry && poetry install --no-interaction
          poetry build || true
          ;;
        pipenv)
          pip install pipenv && pipenv install --deploy
          ;;
        composer)
          apk add --no-cache curl git unzip
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-dev --optimize-autoloader --no-interaction
          ;;
        cargo)
          cargo build --release
          ;;
        dotnet)
          dotnet restore && dotnet build --configuration Release --no-restore
          ;;
        *)
          echo "Unknown tool: ${CI_BUILD_TOOL} — skipping"
          ;;
      esac
  rules:
    - if: '$CI_PIPELINE_SOURCE'
