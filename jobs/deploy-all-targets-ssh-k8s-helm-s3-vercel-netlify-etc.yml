# deploy-all-targets-ssh-k8s-helm-s3-vercel-netlify-etc.yml
# 22 deploy targets, activated by setting DEPLOY_TARGET variable.
# All jobs extend .deploy-base and are gated by rules matching DEPLOY_TARGET value.
#
# Supported targets:
#   ssh-build          — Build on remote host via SSH then restart service
#   ssh-deploy         — rsync artifacts then restart service via SSH
#   docker-compose     — SSH + docker-compose pull & up
#   rsync              — Plain rsync to remote path
#   s3                 — AWS S3 sync
#   s3-cloudfront      — AWS S3 sync + CloudFront invalidation
#   k8s                — kubectl set image on existing deployment
#   k8s-manifest       — kubectl apply manifest files
#   helm               — helm upgrade --install
#   vercel             — vercel CLI deploy
#   netlify            — netlify CLI deploy
#   ftp                — lftp FTP/FTPS upload
#   gcs                — Google Cloud Storage gsutil rsync
#   firebase           — firebase deploy (hosting)
#   heroku             — heroku container push & release
#   ecs                — AWS ECS force new deployment
#   lambda             — AWS Lambda function update
#   azure-webapp       — Azure CLI az webapp deploy
#   capistrano         — cap <stage> deploy
#   ansible            — ansible-playbook
#   pages              — GitLab Pages (artifacts to public/)
#   custom             — Run arbitrary $CUSTOM_DEPLOY_CMD

.deploy-base:
  stage: deploy
  environment:
    name: ${CI_COMMIT_REF_SLUG}
    url: ${DEPLOY_URL}
  rules:
    - if: '$DEPLOY_TARGET == ""'
      when: never
  allow_failure: false

# ══════════════════════════════════════════════════════════════════════════════
# SSH — build on remote server then restart
# ══════════════════════════════════════════════════════════════════════════════

deploy:ssh-build:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "
        set -e
        cd ${DEPLOY_PATH}
        git pull origin ${CI_COMMIT_REF_NAME}
        ${BUILD_CMD:-echo 'No BUILD_CMD set'}
        ${RESTART_CMD:-sudo systemctl restart app 2>/dev/null || true}
      "
  rules:
    - if: '$DEPLOY_TARGET == "ssh-build"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# SSH + rsync — push artifacts then restart
# ══════════════════════════════════════════════════════════════════════════════

deploy:ssh-rsync-artifacts-and-restart:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      rsync ${RSYNC_OPTIONS} \
        -e "ssh -p ${DEPLOY_PORT}" \
        ${DEPLOY_SOURCE_PATH:-.} \
        "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
      ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
        "${RESTART_CMD:-sudo systemctl restart app 2>/dev/null || true}"
  rules:
    - if: '$DEPLOY_TARGET == "ssh-deploy"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Docker Compose — SSH + docker-compose pull & up
# ══════════════════════════════════════════════════════════════════════════════

deploy:docker-compose-pull-and-up-via-ssh:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" "
        set -e
        cd ${DEPLOY_PATH}
        echo '${DOCKER_REGISTRY_PASSWORD}' | docker login ${DOCKER_REGISTRY} \
          -u '${DOCKER_REGISTRY_USER}' --password-stdin 2>/dev/null || true
        docker compose pull
        docker compose up -d --remove-orphans
        docker image prune -f
      "
  rules:
    - if: '$DEPLOY_TARGET == "docker-compose"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Rsync — plain file sync (no restart)
# ══════════════════════════════════════════════════════════════════════════════

deploy:rsync-files-to-remote-host:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      rsync ${RSYNC_OPTIONS} \
        -e "ssh -p ${DEPLOY_PORT}" \
        ${DEPLOY_SOURCE_PATH:-.} \
        "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
  rules:
    - if: '$DEPLOY_TARGET == "rsync"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# AWS S3 — sync static files
# ══════════════════════════════════════════════════════════════════════════════

deploy:aws-s3-sync-static-files:
  extends: .deploy-base
  image: amazon/aws-cli:latest
  script:
    - |
      SOURCE="${DEPLOY_SOURCE_PATH:-dist}"
      aws s3 sync "$SOURCE" "s3://${S3_BUCKET}" \
        --region "${S3_REGION}" \
        --delete \
        ${S3_EXTRA_ARGS:-}
  rules:
    - if: '$DEPLOY_TARGET == "s3"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# AWS S3 + CloudFront — sync then invalidate CDN cache
# ══════════════════════════════════════════════════════════════════════════════

deploy:aws-s3-sync-and-cloudfront-invalidate:
  extends: .deploy-base
  image: amazon/aws-cli:latest
  script:
    - |
      SOURCE="${DEPLOY_SOURCE_PATH:-dist}"
      aws s3 sync "$SOURCE" "s3://${S3_BUCKET}" \
        --region "${S3_REGION}" \
        --delete \
        ${S3_EXTRA_ARGS:-}
      if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
        aws cloudfront create-invalidation \
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
          --paths "/*"
        echo "CloudFront cache invalidated for ${CLOUDFRONT_DISTRIBUTION_ID}"
      else
        echo "CLOUDFRONT_DISTRIBUTION_ID not set, skipping invalidation"
      fi
  rules:
    - if: '$DEPLOY_TARGET == "s3-cloudfront"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Kubernetes — kubectl set image on existing deployment
# ══════════════════════════════════════════════════════════════════════════════

deploy:k8s-kubectl-set-image:
  extends: .deploy-base
  image: bitnami/kubectl:latest
  script:
    - |
      # Configure kubeconfig from CI variable
      echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig 2>/dev/null || \
        echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig

      DEPLOYMENT="${K8S_DEPLOYMENT:-$CI_PROJECT_NAME}"
      IMAGE="${BUILT_IMAGE:-${DOCKER_REGISTRY}/${CI_PROJECT_PATH}:${DOCKER_TAG}}"

      kubectl set image deployment/"${DEPLOYMENT}" \
        "${K8S_CONTAINER}=${IMAGE}" \
        -n "${K8S_NAMESPACE}" \
        --record 2>/dev/null || \
      kubectl set image deployment/"${DEPLOYMENT}" \
        "${K8S_CONTAINER}=${IMAGE}" \
        -n "${K8S_NAMESPACE}"

      kubectl rollout status deployment/"${DEPLOYMENT}" \
        -n "${K8S_NAMESPACE}" \
        --timeout=300s
  rules:
    - if: '$DEPLOY_TARGET == "k8s"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Kubernetes manifests — kubectl apply -f
# ══════════════════════════════════════════════════════════════════════════════

deploy:k8s-apply-manifest-files:
  extends: .deploy-base
  image: bitnami/kubectl:latest
  script:
    - |
      echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig 2>/dev/null || \
        echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig

      MANIFESTS="${K8S_MANIFESTS_PATH:-k8s/}"

      # Substitute image reference in manifests
      IMAGE="${BUILT_IMAGE:-${DOCKER_REGISTRY}/${CI_PROJECT_PATH}:${DOCKER_TAG}}"
      find "$MANIFESTS" -name "*.yml" -o -name "*.yaml" | \
        xargs sed -i "s|__IMAGE__|${IMAGE}|g" 2>/dev/null || true

      kubectl apply -f "$MANIFESTS" -n "${K8S_NAMESPACE}"
      kubectl rollout status deployment \
        -n "${K8S_NAMESPACE}" \
        --timeout=300s 2>/dev/null || true
  rules:
    - if: '$DEPLOY_TARGET == "k8s-manifest"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Helm — upgrade or install chart
# ══════════════════════════════════════════════════════════════════════════════

deploy:helm-upgrade-install-chart:
  extends: .deploy-base
  image: alpine/helm:latest
  script:
    - |
      echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig 2>/dev/null || \
        echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig
      export KUBECONFIG=/tmp/kubeconfig

      RELEASE="${HELM_RELEASE:-$CI_PROJECT_NAME}"
      IMAGE_TAG="${DOCKER_TAG:-$CI_COMMIT_SHORT_SHA}"
      IMAGE_NAME="${DOCKER_IMAGE:-${DOCKER_REGISTRY}/${CI_PROJECT_PATH}}"
      IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

      helm upgrade --install "${RELEASE}" "${HELM_CHART}" \
        --namespace "${HELM_NAMESPACE}" \
        --create-namespace \
        --set image.repository="${IMAGE_NAME}" \
        --set image.tag="${IMAGE_TAG}" \
        --set image.pullPolicy=Always \
        --atomic \
        --timeout 5m \
        --wait \
        ${HELM_EXTRA_ARGS:-}
  rules:
    - if: '$DEPLOY_TARGET == "helm"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Vercel
# ══════════════════════════════════════════════════════════════════════════════

deploy:vercel-cli-deploy:
  extends: .deploy-base
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g vercel --silent
  script:
    - |
      PROD_FLAG=""
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        PROD_FLAG="--prod"
      fi

      vercel deploy $PROD_FLAG \
        --token="${VERCEL_TOKEN}" \
        ${VERCEL_ORG_ID:+--scope=$VERCEL_ORG_ID} \
        ${VERCEL_PROJECT_ID:+--yes} \
        ${DEPLOY_SOURCE_PATH:-.} \
        2>&1 | tee vercel-deploy.log

      DEPLOY_URL=$(grep -oP 'https://[^\s]+\.vercel\.app' vercel-deploy.log | tail -1 || true)
      echo "Deployed to: $DEPLOY_URL"
  rules:
    - if: '$DEPLOY_TARGET == "vercel"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Netlify
# ══════════════════════════════════════════════════════════════════════════════

deploy:netlify-cli-deploy:
  extends: .deploy-base
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g netlify-cli --silent
  script:
    - |
      PROD_FLAG=""
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        PROD_FLAG="--prod"
      fi

      SOURCE="${DEPLOY_SOURCE_PATH:-dist}"

      netlify deploy \
        --auth="${NETLIFY_AUTH_TOKEN}" \
        --site="${NETLIFY_SITE_ID}" \
        --dir="$SOURCE" \
        $PROD_FLAG
  rules:
    - if: '$DEPLOY_TARGET == "netlify"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# FTP / FTPS
# ══════════════════════════════════════════════════════════════════════════════

deploy:ftp-upload-via-lftp:
  extends: .deploy-base
  image: alpine:3.19
  before_script:
    - apk add --no-cache lftp bash
  script:
    - |
      SOURCE="${DEPLOY_SOURCE_PATH:-.}"
      lftp -c "
        set ftp:ssl-allow yes;
        set ssl:verify-certificate no;
        open -u '${FTP_USER}','${FTP_PASSWORD}' '${FTP_HOST}';
        mirror --reverse --delete --verbose \
          '${SOURCE}' '${DEPLOY_PATH:-/public_html/}';
        quit
      "
  rules:
    - if: '$DEPLOY_TARGET == "ftp"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Google Cloud Storage
# ══════════════════════════════════════════════════════════════════════════════

deploy:gcs-gsutil-rsync-static-files:
  extends: .deploy-base
  image: google/cloud-sdk:alpine
  script:
    - |
      # Authenticate via service account key in GCS_SERVICE_ACCOUNT_KEY variable
      if [ -n "$GCS_SERVICE_ACCOUNT_KEY" ]; then
        echo "$GCS_SERVICE_ACCOUNT_KEY" > /tmp/gcs-key.json
        gcloud auth activate-service-account --key-file=/tmp/gcs-key.json
      fi

      SOURCE="${DEPLOY_SOURCE_PATH:-dist}"
      gsutil -m rsync -r -d "$SOURCE" "gs://${GCS_BUCKET}"

      # Optionally set public read ACL
      [ "${GCS_PUBLIC:-false}" = "true" ] && \
        gsutil -m acl ch -r -u AllUsers:R "gs://${GCS_BUCKET}" || true
  rules:
    - if: '$DEPLOY_TARGET == "gcs"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Firebase Hosting
# ══════════════════════════════════════════════════════════════════════════════

deploy:firebase-hosting-deploy:
  extends: .deploy-base
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm install -g firebase-tools --silent
  script:
    - |
      firebase deploy \
        --only hosting \
        --token="${FIREBASE_TOKEN}" \
        --project="${FIREBASE_PROJECT}" \
        --non-interactive
  rules:
    - if: '$DEPLOY_TARGET == "firebase"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Heroku — container push and release
# ══════════════════════════════════════════════════════════════════════════════

deploy:heroku-container-push-and-release:
  extends: .deploy-base
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl bash
    - curl https://cli-assets.heroku.com/install.sh | sh
  script:
    - |
      heroku container:login <<< "${HEROKU_API_KEY}"
      heroku container:push web \
        --app="${HEROKU_APP}" \
        --context-path="${DOCKER_BUILD_CONTEXT:-.}"
      heroku container:release web \
        --app="${HEROKU_APP}"
  rules:
    - if: '$DEPLOY_TARGET == "heroku"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# AWS ECS — force new deployment
# ══════════════════════════════════════════════════════════════════════════════

deploy:aws-ecs-force-new-deployment:
  extends: .deploy-base
  image: amazon/aws-cli:latest
  script:
    - |
      aws ecs update-service \
        --cluster "${ECS_CLUSTER}" \
        --service "${ECS_SERVICE}" \
        --force-new-deployment \
        --region "${AWS_DEFAULT_REGION:-us-east-1}"

      # Wait for service to stabilize
      aws ecs wait services-stable \
        --cluster "${ECS_CLUSTER}" \
        --services "${ECS_SERVICE}" \
        --region "${AWS_DEFAULT_REGION:-us-east-1}"
  rules:
    - if: '$DEPLOY_TARGET == "ecs"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# AWS Lambda — update function code
# ══════════════════════════════════════════════════════════════════════════════

deploy:aws-lambda-update-function-code:
  extends: .deploy-base
  image: amazon/aws-cli:latest
  script:
    - |
      if [ -n "$BUILT_IMAGE" ]; then
        # Container image Lambda
        aws lambda update-function-code \
          --function-name "${LAMBDA_FUNCTION}" \
          --image-uri "${BUILT_IMAGE}" \
          --region "${AWS_DEFAULT_REGION:-us-east-1}"
      else
        # Zip deployment
        SOURCE="${DEPLOY_SOURCE_PATH:-.}"
        cd "$SOURCE"
        zip -r /tmp/lambda-package.zip . -x "*.git*"
        aws lambda update-function-code \
          --function-name "${LAMBDA_FUNCTION}" \
          --zip-file fileb:///tmp/lambda-package.zip \
          --region "${AWS_DEFAULT_REGION:-us-east-1}"
      fi

      aws lambda wait function-updated \
        --function-name "${LAMBDA_FUNCTION}" \
        --region "${AWS_DEFAULT_REGION:-us-east-1}"
  rules:
    - if: '$DEPLOY_TARGET == "lambda"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Azure Web App
# ══════════════════════════════════════════════════════════════════════════════

deploy:azure-webapp-deploy-via-az-cli:
  extends: .deploy-base
  image: mcr.microsoft.com/azure-cli:latest
  script:
    - |
      # Login via service principal
      az login --service-principal \
        -u "${AZURE_CLIENT_ID}" \
        -p "${AZURE_CLIENT_SECRET}" \
        --tenant "${AZURE_TENANT_ID}" \
        --output none

      if [ -n "$BUILT_IMAGE" ]; then
        # Container deploy
        az webapp config container set \
          --name "${AZURE_WEBAPP_NAME}" \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --docker-custom-image-name "${BUILT_IMAGE}"
        az webapp restart \
          --name "${AZURE_WEBAPP_NAME}" \
          --resource-group "${AZURE_RESOURCE_GROUP}"
      else
        # Zip deploy
        SOURCE="${DEPLOY_SOURCE_PATH:-.}"
        cd "$SOURCE"
        zip -r /tmp/azure-package.zip .
        az webapp deploy \
          --name "${AZURE_WEBAPP_NAME}" \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --src-path /tmp/azure-package.zip \
          --type zip
      fi
  rules:
    - if: '$DEPLOY_TARGET == "azure-webapp"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Capistrano
# ══════════════════════════════════════════════════════════════════════════════

deploy:capistrano-cap-stage-deploy:
  extends: .deploy-base
  image: ruby:3-alpine
  before_script:
    - apk add --no-cache openssh-client git bash
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
    - bundle install --quiet
  script:
    - bundle exec cap "${CAPISTRANO_STAGE}" deploy
  rules:
    - if: '$DEPLOY_TARGET == "capistrano"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Ansible
# ══════════════════════════════════════════════════════════════════════════════

deploy:ansible-playbook-run:
  extends: .deploy-base
  image: cytopia/ansible:latest
  before_script:
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      [ -n "$DEPLOY_HOST" ] && \
        ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ansible-playbook "${ANSIBLE_PLAYBOOK}" \
        -i "${ANSIBLE_INVENTORY}" \
        --extra-vars "app_version=${CI_COMMIT_SHORT_SHA} deploy_path=${DEPLOY_PATH}" \
        ${ANSIBLE_EXTRA_ARGS:-}
  rules:
    - if: '$DEPLOY_TARGET == "ansible"'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# GitLab Pages — static site hosting built into GitLab
# ══════════════════════════════════════════════════════════════════════════════

deploy:gitlab-pages-publish-public-dir:
  stage: deploy
  script:
    - |
      SOURCE="${DEPLOY_SOURCE_PATH:-public}"
      if [ "$SOURCE" != "public" ]; then
        mkdir -p public
        cp -r "${SOURCE}/." public/
      fi
      echo "GitLab Pages will be published from public/"
  artifacts:
    paths:
      - public
    expire_in: never
  environment:
    name: gitlab-pages
    url: "https://${CI_PROJECT_NAMESPACE}.gitlab.io/${CI_PROJECT_NAME}"
  rules:
    - if: '$DEPLOY_TARGET == "pages" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never

# ══════════════════════════════════════════════════════════════════════════════
# Custom — escape hatch for any unsupported deploy target
# ══════════════════════════════════════════════════════════════════════════════

deploy:custom-command-escape-hatch:
  extends: .deploy-base
  image: "${CUSTOM_DEPLOY_IMAGE:-alpine:3.19}"
  before_script:
    - |
      # Optional SSH setup for custom commands that need it
      if [ -n "$DEPLOY_KEY" ]; then
        apk add --no-cache openssh-client 2>/dev/null || true
        eval $(ssh-agent -s)
        echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        [ -n "$DEPLOY_HOST" ] && \
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
      fi
  script:
    - |
      if [ -z "$CUSTOM_DEPLOY_CMD" ]; then
        echo "ERROR: DEPLOY_TARGET=custom requires CUSTOM_DEPLOY_CMD to be set"
        exit 1
      fi
      eval "$CUSTOM_DEPLOY_CMD"
  rules:
    - if: '$DEPLOY_TARGET == "custom"'
      when: always
    - when: never
