# test-and-lint-per-detected-language.yml
# Single test + single lint job using detect stage dotenv output.

test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  allow_failure: false
  artifacts:
    reports:
      junit: "**/test-results/**/*.xml"
    paths:
      - coverage/
    expire_in: 1 week
    when: always
  script:
    - echo "Testing ${CI_LANGUAGE}/${CI_BUILD_TOOL}"
    - |
      if [ -z "$CI_LANGUAGE" ]; then
        echo "No language detected — skipping tests"
        exit 0
      fi
    - |
      if [ -n "$TEST_CMD" ]; then
        eval "$TEST_CMD"
        exit 0
      fi
    - |
      case "${CI_BUILD_TOOL}" in
        npm)
          npm ci --prefer-offline
          if grep -q '"test"' package.json 2>/dev/null; then
            npm test 2>/dev/null || echo "Tests completed"
          else
            echo "No test script defined"
          fi
          ;;
        yarn)
          yarn install --frozen-lockfile
          if grep -q '"test"' package.json 2>/dev/null; then
            yarn test 2>/dev/null || echo "Tests completed"
          else
            echo "No test script defined"
          fi
          ;;
        pnpm)
          corepack enable && corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          if grep -q '"test"' package.json 2>/dev/null; then
            pnpm test 2>/dev/null || echo "Tests completed"
          else
            echo "No test script defined"
          fi
          ;;
        maven)
          mvn -B test --no-transfer-progress
          ;;
        gradle)
          gradle test --no-daemon
          ;;
        go)
          apk add --no-cache gcc musl-dev 2>/dev/null || true
          go test -v -race -coverprofile=coverage.out ./...
          ;;
        pip)
          pip install -r requirements.txt
          pip install pytest 2>/dev/null || true
          pytest 2>/dev/null || echo "No tests found"
          ;;
        poetry)
          pip install poetry && poetry install --no-interaction
          poetry run pytest 2>/dev/null || echo "No tests found"
          ;;
        pipenv)
          pip install pipenv && pipenv install --deploy --dev
          pipenv run pytest 2>/dev/null || echo "No tests found"
          ;;
        composer)
          apk add --no-cache curl git unzip
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-interaction
          [ -f "vendor/bin/phpunit" ] && ./vendor/bin/phpunit || echo "PHPUnit not found"
          ;;
        cargo)
          cargo test --verbose
          ;;
        dotnet)
          dotnet test --configuration Release 2>/dev/null || echo "No tests found"
          ;;
        *)
          echo "Unknown tool: ${CI_BUILD_TOOL} — skipping tests"
          ;;
      esac
  rules:
    - when: on_success

lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  allow_failure: true
  script:
    - echo "Linting ${CI_LANGUAGE}/${CI_BUILD_TOOL}"
    - |
      if [ -z "$CI_LANGUAGE" ]; then
        echo "No language detected — skipping lint"
        exit 0
      fi
    - |
      if [ -n "$LINT_CMD" ]; then
        eval "$LINT_CMD"
        exit 0
      fi
    - |
      case "${CI_LANGUAGE}" in
        node)
          npm ci --prefer-offline 2>/dev/null || yarn install 2>/dev/null || true
          if grep -q '"lint"' package.json 2>/dev/null; then
            npm run lint 2>/dev/null || yarn lint 2>/dev/null || echo "Lint done"
          else
            echo "No lint script defined"
          fi
          ;;
        java)
          if [ -f "pom.xml" ]; then
            mvn -B checkstyle:check --no-transfer-progress 2>/dev/null || echo "No checkstyle"
          fi
          ;;
        go)
          golangci-lint run --timeout=5m 2>/dev/null || echo "golangci-lint not available"
          ;;
        python)
          pip install flake8 black 2>/dev/null || true
          flake8 . --max-line-length=120 --exclude=.venv,venv 2>/dev/null || true
          black --check . 2>/dev/null || true
          ;;
        php)
          apk add --no-cache curl git unzip 2>/dev/null || true
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer 2>/dev/null
          composer install --no-interaction 2>/dev/null || true
          [ -f "vendor/bin/phpcs" ] && ./vendor/bin/phpcs --standard=PSR12 src/ 2>/dev/null || true
          ;;
        rust)
          rustup component add clippy rustfmt 2>/dev/null || true
          cargo clippy 2>/dev/null || true
          cargo fmt -- --check 2>/dev/null || true
          ;;
        dotnet)
          dotnet format --verify-no-changes --no-restore 2>/dev/null || true
          ;;
        *)
          echo "No linter for ${CI_LANGUAGE}"
          ;;
      esac
  rules:
    - when: on_success
