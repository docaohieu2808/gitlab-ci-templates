# custom-override-variables-and-deploy-target.gitlab-ci.yml
# Full override example showing how to customize any aspect of the auto-pipeline.
# Copy relevant sections into your .gitlab-ci.yml as needed.

include:
  - project: 'cicd-auto-pipeline/gitlab-ci-templates'
    file: '/auto-pipeline.yml'

# ── Override global variables ─────────────────────────────────────────────────
variables:
  # Force a specific language/build tool instead of auto-detect
  # CI_LANGUAGE: "node"
  # CI_BUILD_TOOL: "pnpm"

  # Pin runtime versions
  NODE_VERSION: "20"
  # JAVA_VERSION: "21"
  # GO_VERSION: "1.22"
  # PYTHON_VERSION: "3.12"

  # Override build/test/lint commands
  BUILD_CMD: "pnpm run build:prod"
  TEST_CMD: "pnpm run test:ci -- --coverage"
  LINT_CMD: "pnpm run lint:strict"

  # Docker image name (defaults to $CI_REGISTRY_IMAGE)
  DOCKER_IMAGE: "registry.example.com/myorg/myapp"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKERFILE_PATH: "docker/Dockerfile.prod"
  DOCKER_PLATFORMS: "linux/amd64,linux/arm64"

  # Security — disable individual scanners
  SAST_ENABLED: "true"
  DEPENDENCY_SCAN_ENABLED: "true"
  SECRET_DETECTION_ENABLED: "true"
  CONTAINER_SCAN_ENABLED: "false"   # skip if no Docker image

  # ── Deploy target: pick ONE from the list below ──────────────────────────
  # DEPLOY_TARGET: "ssh-build"
  # DEPLOY_TARGET: "ssh-deploy"
  # DEPLOY_TARGET: "docker-compose"
  # DEPLOY_TARGET: "rsync"
  # DEPLOY_TARGET: "s3"
  # DEPLOY_TARGET: "s3-cloudfront"
  # DEPLOY_TARGET: "k8s"
  # DEPLOY_TARGET: "k8s-manifest"
  # DEPLOY_TARGET: "helm"
  # DEPLOY_TARGET: "vercel"
  # DEPLOY_TARGET: "netlify"
  # DEPLOY_TARGET: "ftp"
  # DEPLOY_TARGET: "gcs"
  # DEPLOY_TARGET: "firebase"
  # DEPLOY_TARGET: "heroku"
  # DEPLOY_TARGET: "ecs"
  # DEPLOY_TARGET: "lambda"
  # DEPLOY_TARGET: "azure-webapp"
  # DEPLOY_TARGET: "capistrano"
  # DEPLOY_TARGET: "ansible"
  # DEPLOY_TARGET: "pages"
  # DEPLOY_TARGET: "custom"

  # Example: deploy via docker-compose over SSH
  DEPLOY_TARGET: "docker-compose"
  DEPLOY_HOST: "prod.example.com"
  DEPLOY_USER: "deploy"
  DEPLOY_PORT: "22"
  DEPLOY_PATH: "/opt/myapp"
  # DEPLOY_KEY: stored in CI/CD variables (masked + protected)

  # Example: s3-cloudfront overrides
  # S3_BUCKET: "my-frontend-bucket"
  # S3_REGION: "ap-southeast-1"
  # CLOUDFRONT_DISTRIBUTION_ID: "EXXXXXXXXXXXXX"

  # Example: Helm overrides
  # HELM_RELEASE: "myapp"
  # HELM_CHART: "./helm/myapp"
  # HELM_NAMESPACE: "production"
  # HELM_EXTRA_ARGS: "--values helm/values.prod.yaml"
  # K8S_NAMESPACE: "production"

  # Example: Vercel overrides
  # VERCEL_TOKEN: stored in CI/CD variables
  # VERCEL_ORG_ID: "team_xxxxxxxxxx"
  # VERCEL_PROJECT_ID: "prj_xxxxxxxxxx"

  # Example: custom escape hatch
  # DEPLOY_TARGET: "custom"
  # CUSTOM_DEPLOY_IMAGE: "alpine:3.19"
  # CUSTOM_DEPLOY_CMD: "sh scripts/my-deploy.sh"

# ── Override a specific job ───────────────────────────────────────────────────
# You can extend or override any job from the included templates.

# Example: add extra steps to the build job
# build:node:pnpm:
#   before_script:
#     - !reference [build:node:pnpm, before_script]  # keep original before_script
#     - echo "Custom pre-build step"
#   after_script:
#     - echo "Notify build complete"

# Example: restrict deploy to protected branches only
# deploy:docker-compose-pull-and-up-via-ssh:
#   rules:
#     - if: '$DEPLOY_TARGET == "docker-compose" && $CI_COMMIT_BRANCH == "main"'
#       when: manual        # require manual trigger on main
#     - when: never

# Example: add a notification job after deploy
# notify:slack-on-deploy-success:
