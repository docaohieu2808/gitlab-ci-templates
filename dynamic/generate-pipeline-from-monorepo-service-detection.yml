# Dynamic child pipeline for a monorepo.
#
# Job 1 (generate-monorepo-pipeline) scans the top-level directories, recognises a
# service by its manifest (package.json, pom.xml, go.mod, requirements.txt,
# pyproject.toml, Cargo.toml, composer.json, *.csproj), decides which services
# changed, and writes generated-pipeline.yml with one CI job per changed service
# (plus a docker job when the service has a Dockerfile).
# Job 2 (run-generated-pipeline) triggers that file as a child pipeline and mirrors
# its result (strategy: depend), so a failing service test fails the parent too.
#
# Which services run:
#   - default branch and tag pipelines: every service (the whole tree is verified)
#   - other pipelines: only services with files changed since the previous commit or,
#     in a merge request, since the diff base. If git cannot tell (first push, shallow
#     history), every service runs and the job log says so.
#
# Usage:
#   include:
#     - project: 'your-group/gitlab-ci-templates'
#       ref: 1.0.0
#       file: '/dynamic/generate-pipeline-from-monorepo-service-detection.yml'

variables:
  MONOREPO_EXCLUDE_DIRS: ".git node_modules vendor dist build target .cache"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"
  GO_VERSION: "1.27"
  JAVA_VERSION: "25"
  PHP_IMAGE: "composer:2"
  RUST_IMAGE: "rust:1-alpine"
  DOTNET_VERSION: "10.0"
  GIT_DEPTH: "100"

generate-monorepo-pipeline:
  stage: .pre
  image: alpine:3.24
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -eu
      out=generated-pipeline.yml

      is_excluded() { for ex in $MONOREPO_EXCLUDE_DIRS; do [ "$1" = "$ex" ] && return 0; done; return 1; }

      detect_language() {
        d="$1"
        if [ -f "$d/package.json" ]; then echo node
        elif [ -f "$d/pom.xml" ]; then echo java
        elif [ -f "$d/go.mod" ]; then echo go
        elif [ -f "$d/requirements.txt" ] || [ -f "$d/pyproject.toml" ]; then echo python
        elif [ -f "$d/Cargo.toml" ]; then echo rust
        elif [ -f "$d/composer.json" ]; then echo php
        elif ls "$d"/*.csproj >/dev/null 2>&1; then echo dotnet
        else echo unknown
        fi
      }

      # Decide whether a service is part of this run.
      run_all=false
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      changed_files=""
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-}" ]; then
        run_all=true; echo "Default branch or tag pipeline: all services run"
      elif [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
        run_all=true; echo "No usable diff base (first push): all services run"
      elif changed_files="$(git diff --name-only "$base" "$CI_COMMIT_SHA" 2>/dev/null)"; then
        echo "Changed files since $base:"; echo "$changed_files"
      else
        run_all=true; echo "git diff against $base failed (shallow history?): all services run"
      fi
      service_changed() {
        [ "$run_all" = true ] && return 0
        printf '%s\n' "$changed_files" | grep -q "^$1/"
      }

      printf 'stages:\n  - ci\n  - docker\n\n' > "$out"
      found=0
      selected=0
      for entry in */; do
        svc="${entry%/}"
        [ -d "$svc" ] || continue
        is_excluded "$svc" && continue
        lang="$(detect_language "$svc")"
        [ "$lang" = unknown ] && continue
        found=$((found + 1))
        service_changed "$svc" || { echo "skip $svc ($lang): no changes"; continue; }
        selected=$((selected + 1))
        echo "service $svc ($lang)"

        entrypoint=false
        case "$lang" in
          node)
            image="node:${NODE_VERSION}-alpine"
            cmd='if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run build --if-present && npm test --if-present' ;;
          python)
            image="python:${PYTHON_VERSION}-alpine"
            cmd='if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install .; fi && pip install pytest && { rc=0; pytest -q || rc=$?; [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ]; }' ;;
          go)
            image="golang:${GO_VERSION}-alpine"
            cmd='go vet ./... && go build ./... && go test ./...' ;;
          java)
            image="maven:3-eclipse-temurin-${JAVA_VERSION}"
            cmd='mvn -B -ntp verify' ;;
          rust)
            image="$RUST_IMAGE"; entrypoint=true
            cmd='apk add --no-cache musl-dev && cargo build && cargo test' ;;
          php)
            image="$PHP_IMAGE"; entrypoint=true
            cmd='composer install --no-interaction && if [ -x vendor/bin/phpunit ]; then vendor/bin/phpunit; fi' ;;
          dotnet)
            image="mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}"
            cmd='dotnet build && dotnet test' ;;
        esac

        name="$(printf '%s' "$svc" | tr '[:upper:]_/' '[:lower:]--')"
        {
          printf 'ci:%s:\n  stage: ci\n' "$name"
          if [ "$entrypoint" = true ]; then
            printf '  image:\n    name: %s\n    entrypoint: [""]\n' "$image"
          else
            printf '  image: %s\n' "$image"
          fi
          printf '  script:\n    - cd %s\n    - |\n      %s\n\n' "$svc" "$cmd"
        } >> "$out"

        if [ -f "$svc/Dockerfile" ]; then
          {
            printf 'docker:%s:\n  stage: docker\n  image: docker:29-cli\n  services:\n    - docker:29-dind\n' "$name"
            printf '  variables:\n    DOCKER_HOST: tcp://docker:2376\n    DOCKER_TLS_CERTDIR: "/certs"\n'
            printf '    DOCKER_TLS_VERIFY: "1"\n    DOCKER_CERT_PATH: "/certs/client"\n'
            printf '  needs: ["ci:%s"]\n' "$name"
            printf '  script:\n'
            printf '    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"\n'
            printf '    - docker build -t "$CI_REGISTRY_IMAGE/%s:$CI_COMMIT_SHORT_SHA" %s\n' "$name" "$svc"
            printf '    - docker push "$CI_REGISTRY_IMAGE/%s:$CI_COMMIT_SHORT_SHA"\n' "$name"
            printf '  rules:\n    - if: '"'"'$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'"'"'\n\n'
          } >> "$out"
        fi
      done

      echo "Services found: $found, selected: $selected"
      if [ "$selected" -eq 0 ]; then
        printf 'nothing-to-run:\n  stage: ci\n  image: alpine:3.24\n  script:\n    - echo "No service changed in this pipeline (services found: %s)"\n' "$found" >> "$out"
      fi
      cat "$out"
  artifacts:
    paths:
      - generated-pipeline.yml
    expire_in: 1 day

run-generated-pipeline:
  stage: build
  needs:
    - job: generate-monorepo-pipeline
      artifacts: true
  trigger:
    include:
      - artifact: generated-pipeline.yml
        job: generate-monorepo-pipeline
    strategy: depend
