# dynamic/generate-pipeline-from-monorepo-service-detection.yml — Level 5: Dynamic pipeline generation
# Scans a monorepo at runtime, detects services by manifest files (package.json, pom.xml, go.mod,
# requirements.txt, Cargo.toml, composer.json), generates a per-service CI YAML, then triggers it.
#
# Usage:
#   include:
#     - project: 'cicd-auto-pipeline/gitlab-ci-templates'
#       file: '/dynamic/generate-pipeline-from-monorepo-service-detection.yml'

stages:
  - .pre
  - build

variables:
  # Directories to exclude from service detection (space-separated)
  MONOREPO_EXCLUDE_DIRS: ".git node_modules vendor dist build target .cache"
  # Base image for generate job
  GENERATE_IMAGE: "alpine:3.19"
  # Default Docker registry for generated build jobs
  DOCKER_REGISTRY: "$CI_REGISTRY"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"

# ── Stage: .pre — detect services and emit generated-pipeline.yml ────────────

generate-pipeline:
  stage: .pre
  image: "${GENERATE_IMAGE}"
  script:
    - |
      #!/bin/sh
      set -e

      OUTPUT="generated-pipeline.yml"
      EXCLUDE="${MONOREPO_EXCLUDE_DIRS}"

      echo "==> Scanning monorepo for services..."
      echo "    Exclude dirs: $EXCLUDE"

      # ── Helper: check if dir is excluded ────────────────────────────────────
      is_excluded() {
        DIR="$1"
        for EX in $EXCLUDE; do
          [ "$DIR" = "$EX" ] && return 0
        done
        return 1
      }

      # ── Detect language from manifest ────────────────────────────────────────
      detect_language() {
        DIR="$1"
        [ -f "$DIR/package.json" ]      && echo "node"   && return
        [ -f "$DIR/pom.xml" ]           && echo "java"   && return
        [ -f "$DIR/build.gradle" ]      && echo "java"   && return
        [ -f "$DIR/go.mod" ]            && echo "go"     && return
        [ -f "$DIR/requirements.txt" ]  && echo "python" && return
        [ -f "$DIR/pyproject.toml" ]    && echo "python" && return
        [ -f "$DIR/Cargo.toml" ]        && echo "rust"   && return
        [ -f "$DIR/composer.json" ]     && echo "php"    && return
        [ -f "$DIR/*.csproj" ]          && echo "dotnet" && return
        echo "unknown"
      }

      # ── Detect build image per language ─────────────────────────────────────
      build_image() {
        case "$1" in
          node)   echo "node:20-alpine" ;;
          java)   echo "maven:3.9-eclipse-temurin-21-alpine" ;;
          go)     echo "golang:1.22-alpine" ;;
          python) echo "python:3.12-alpine" ;;
          rust)   echo "rust:1.77-alpine" ;;
          php)    echo "composer:2.7" ;;
          *)      echo "alpine:3.19" ;;
        esac
      }

      # ── Detect build command per language ────────────────────────────────────
      build_cmd() {
        case "$1" in
          node)   echo "npm ci --prefer-offline && npm run build" ;;
          java)   echo "mvn package -DskipTests -q" ;;
          go)     echo "go build -o app ./..." ;;
          python) echo "pip install -r requirements.txt -q" ;;
          rust)   echo "cargo build --release" ;;
          php)    echo "composer install --no-dev --optimize-autoloader -q" ;;
          *)      echo "echo 'No build command for unknown language'" ;;
        esac
      }

      # ── Detect test command per language ─────────────────────────────────────
      test_cmd() {
        case "$1" in
          node)   echo "npm test -- --passWithNoTests" ;;
          java)   echo "mvn test -q" ;;
          go)     echo "go test ./... -v" ;;
          python) echo "python -m pytest --tb=short || true" ;;
          rust)   echo "cargo test" ;;
          php)    echo "vendor/bin/phpunit || true" ;;
          *)      echo "echo 'No test command'" ;;
        esac
      }

      # ── Write pipeline header ────────────────────────────────────────────────
      cat > "$OUTPUT" << 'YAML_HEADER'
      # AUTO-GENERATED by generate-pipeline — DO NOT EDIT MANUALLY
      # Generated at: GENERATED_AT_PLACEHOLDER

      stages:
        - build
        - test
        - docker-build

      YAML_HEADER

      # Replace placeholder with actual timestamp
      TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      sed -i "s/GENERATED_AT_PLACEHOLDER/$TIMESTAMP/" "$OUTPUT"

      SERVICES_FOUND=0

      # ── Scan top-level directories ───────────────────────────────────────────
      for dir in */; do
        # Strip trailing slash
        SERVICE="${dir%/}"

        # Skip excluded and non-directories
        [ ! -d "$SERVICE" ] && continue
        is_excluded "$SERVICE" && continue

        LANG=$(detect_language "$SERVICE")
        [ "$LANG" = "unknown" ] && continue

        SERVICES_FOUND=$((SERVICES_FOUND + 1))
        IMG=$(build_image "$LANG")
        BUILD=$(build_cmd "$LANG")
        TEST=$(test_cmd "$LANG")
        SAFE_NAME=$(echo "$SERVICE" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]')

        echo "    Detected service: $SERVICE (language=$LANG)"

        # ── Emit build job ─────────────────────────────────────────────────────
        cat >> "$OUTPUT" << YAML_JOB

      build:${SAFE_NAME}:
        stage: build
        image: ${IMG}
        script:
          - cd ${SERVICE}
          - ${BUILD}
        artifacts:
          paths:
            - ${SERVICE}/dist/
            - ${SERVICE}/target/
            - ${SERVICE}/build/
            - ${SERVICE}/app
          expire_in: 1 hour
          when: always
        rules:
          - changes:
              - ${SERVICE}/**/*
          - if: '\$CI_COMMIT_BRANCH == \$CI_DEFAULT_BRANCH'

      test:${SAFE_NAME}:
        stage: test
        image: ${IMG}
        needs: ["build:${SAFE_NAME}"]
        script:
          - cd ${SERVICE}
          - ${TEST}
        rules:
          - changes:
              - ${SERVICE}/**/*
          - if: '\$CI_COMMIT_BRANCH == \$CI_DEFAULT_BRANCH'

      YAML_JOB

        # Emit docker-build job only if Dockerfile present
        if [ -f "$SERVICE/Dockerfile" ]; then
          cat >> "$OUTPUT" << YAML_DOCKER

      docker-build:${SAFE_NAME}:
        stage: docker-build
        image: docker:25-cli
        services:
          - docker:25-dind
        needs: ["test:${SAFE_NAME}"]
        variables:
          IMAGE_NAME: "\${DOCKER_REGISTRY}/${SAFE_NAME}:\${DOCKER_TAG}"
        script:
          - docker login -u "\$CI_REGISTRY_USER" -p "\$CI_REGISTRY_PASSWORD" "\$CI_REGISTRY"
          - docker build -t "\$IMAGE_NAME" ${SERVICE}/
          - docker push "\$IMAGE_NAME"
        rules:
          - if: '\$CI_COMMIT_BRANCH == \$CI_DEFAULT_BRANCH'
            changes:
              - ${SERVICE}/**/*

      YAML_DOCKER
        fi

      done  # end for dir

      echo "==> Services detected: $SERVICES_FOUND"

      if [ "$SERVICES_FOUND" -eq 0 ]; then
        echo "WARNING: No services detected — generating no-op pipeline"
        cat >> "$OUTPUT" << 'YAML_NOOP'

      no-services-detected:
        stage: build
        image: alpine:3.19
        script:
          - echo "No services with known manifests found in monorepo root"
      YAML_NOOP
      fi

      echo "==> Generated pipeline:"
      cat "$OUTPUT"

  artifacts:
    paths:
      - generated-pipeline.yml
    expire_in: 1 hour

# ── Stage: build — trigger the generated pipeline ────────────────────────────

run-dynamic:
  stage: build
  trigger:
    include:
      - artifact: generated-pipeline.yml
        job: generate-pipeline
    strategy: depend
  needs:
    - job: generate-pipeline
      artifacts: true
