variables:
  NODE_VERSION: "$[[ inputs.node_version ]]"
  PYTHON_VERSION: "$[[ inputs.python_version ]]"
  GO_VERSION: "$[[ inputs.go_version ]]"
  JAVA_VERSION: "$[[ inputs.java_version ]]"
  PHP_IMAGE: "$[[ inputs.php_image ]]"
  RUST_IMAGE: "$[[ inputs.rust_image ]]"
  DOTNET_VERSION: "$[[ inputs.dotnet_version ]]"
  DOCKER_BUILD_ENABLED: "$[[ inputs.docker_build_enabled ]]"
  DOCKER_IMAGE: "$[[ inputs.docker_image ]]"
  DOCKERFILE_PATH: "$[[ inputs.dockerfile_path ]]"
  DOCKER_BUILD_CONTEXT: "$[[ inputs.docker_build_context ]]"
  DOCKER_BUILD_ARGS: "$[[ inputs.docker_build_args ]]"
  SECURITY_SCAN_ENABLED: "$[[ inputs.security_scan_enabled ]]"
  SAST_ENABLED: "$[[ inputs.sast_enabled ]]"
  SECRET_DETECTION_ENABLED: "$[[ inputs.secret_detection_enabled ]]"
  DEPENDENCY_SCAN_ENABLED: "$[[ inputs.dependency_scan_enabled ]]"
  CONTAINER_SCAN_ENABLED: "$[[ inputs.container_scan_enabled ]]"
