  K8S_NAMESPACE: "$[[ inputs.k8s_namespace ]]"
  K8S_DEPLOYMENT: "$[[ inputs.k8s_deployment ]]"
  K8S_CONTAINER: "$[[ inputs.k8s_container ]]"
  HELM_RELEASE: "$[[ inputs.helm_release ]]"
  HELM_CHART: "$[[ inputs.helm_chart ]]"
  HELM_NAMESPACE: "$[[ inputs.helm_namespace ]]"
  DEPLOY_TIMEOUT: "$[[ inputs.deploy_timeout ]]"

# Stage order shared by every fragment in jobs/. Include this file first when you
# pick fragments one by one; auto-pipeline.yml already contains it.
stages:
  - lint
  - build
  - test
  - docker-build
  - security-scan
  - deploy

# Per-language lint / build / test jobs. A job exists only when its manifest file
# exists (rules:exists), and each language runs in its own image, so a Go repo is
# never built inside a node image. A failing test fails the job: there is no
# `|| echo` anywhere. Only "the project defines no test/lint step" is a skip, and
# it is printed.
#
# To change a command, redefine the job in your .gitlab-ci.yml, for example:
#   test:node:
#     script: [npm run test:ci]
# Needs: jobs/stages.yml and jobs/variables.yml (already inside auto-pipeline.yml).

.build-artifacts:
  artifacts:
    paths:
      - dist/
      - build/
      - target/
      - bin/
    expire_in: 1 day
    when: on_success

# ── Node.js (npm, pnpm and yarn through corepack; corepack ships with Node 24) ─

.node:
  image: node:${NODE_VERSION}-alpine
  rules:
    - exists:
        - package.json
  cache:
    key: "${CI_COMMIT_REF_SLUG}-npm"
    paths:
      - .npm/
  before_script:
    - |
      export npm_config_cache="$CI_PROJECT_DIR/.npm"
      if [ -f pnpm-lock.yaml ]; then
        corepack enable
        pnpm install --frozen-lockfile
        PM=pnpm
      elif [ -f yarn.lock ]; then
        corepack enable
        if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi
        PM=yarn
      elif [ -f package-lock.json ]; then
        npm ci
        PM=npm
      else
        npm install
        PM=npm
      fi

lint:node:
  extends: .node
  stage: lint
  script:
    - |
      if grep -Eq '"lint"[[:space:]]*:' package.json; then "$PM" run lint; else echo "package.json has no lint script - nothing to lint"; fi

build:node:
  extends: [.node, .build-artifacts]
  stage: build
  script:
    - |
      if grep -Eq '"build"[[:space:]]*:' package.json; then "$PM" run build; else echo "package.json has no build script - nothing to build"; fi

test:node:
  extends: .node
  stage: test
  script:
    - |
      if grep -Eq '"test"[[:space:]]*:' package.json; then "$PM" test; else echo "package.json has no test script - nothing to test"; fi

# ── Python (requirements.txt or a PEP 517 pyproject.toml) ──────────────────────

.python:
  image: python:${PYTHON_VERSION}-alpine
  rules:
    - exists:
        - requirements.txt
        - pyproject.toml
  cache:
    key: "${CI_COMMIT_REF_SLUG}-pip"
    paths:
      - .cache/pip/
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - |
      if [ -f requirements.txt ]; then
        pip install -r requirements.txt
      else
        pip install .
      fi

lint:python:
  extends: .python
  stage: lint
  script:
    - pip install ruff
    - ruff check .

build:python:
  extends: .python
  stage: build
  script:
    - python -m compileall -q -x '/(\.venv|\.cache)/' .

test:python:
  extends: .python
  stage: test
  script:
    - pip install pytest
    - |
      rc=0
      pytest -q || rc=$?
      if [ "$rc" -eq 5 ]; then echo "pytest collected no tests - nothing to test"; exit 0; fi
      exit "$rc"

# ── Java: Maven and Gradle ─────────────────────────────────────────────────────

.maven:
  image: maven:3-eclipse-temurin-${JAVA_VERSION}
  rules:
    - exists:
        - pom.xml

build:java-maven:
  extends: [.maven, .build-artifacts]
  stage: build
  script:
    - mvn -B -ntp package -DskipTests

test:java-maven:
  extends: .maven
  stage: test
  script:
    - mvn -B -ntp test

.gradle:
  image: gradle:9-jdk${JAVA_VERSION}
  rules:
    - exists:
        - build.gradle
        - build.gradle.kts

build:java-gradle:
  extends: [.gradle, .build-artifacts]
  stage: build
  script:
    - gradle build -x test --no-daemon

test:java-gradle:
  extends: .gradle
  stage: test
  script:
    - gradle test --no-daemon

# ── Go ─────────────────────────────────────────────────────────────────────────

.go:
  image: golang:${GO_VERSION}-alpine
  rules:
    - exists:
        - go.mod

lint:go:
  extends: .go
  stage: lint
  script:
    - go vet ./...

build:go:
  extends: [.go, .build-artifacts]
  stage: build
  script:
    - go build -v -o bin/ ./...

test:go:
  extends: .go
  stage: test
  script:
    - go test ./...

# ── PHP (Composer) ─────────────────────────────────────────────────────────────

.php:
  image:
    name: ${PHP_IMAGE}
    entrypoint: [""]
  rules:
    - exists:
        - composer.json
  before_script:
    - composer install --no-interaction --prefer-dist

lint:php:
  extends: .php
  stage: lint
  script:
    - composer validate --strict

build:php:
  extends: .php
  stage: build
  script:
    - composer dump-autoload --optimize

test:php:
  extends: .php
  stage: test
  script:
    - |
      if [ -x vendor/bin/phpunit ]; then vendor/bin/phpunit; else echo "phpunit is not installed - nothing to test"; fi

# ── Rust (Cargo) ───────────────────────────────────────────────────────────────

.rust:
  image:
    name: ${RUST_IMAGE}
    entrypoint: [""]
  rules:
    - exists:
        - Cargo.toml
  before_script:
    - apk add --no-cache musl-dev

lint:rust:
  extends: .rust
  stage: lint
  script:
    - rustup component add clippy rustfmt
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings

build:rust:
  extends: [.rust, .build-artifacts]
  stage: build
  script:
    - cargo build --release

test:rust:
  extends: .rust
  stage: test
  script:
    - cargo test

# ── .NET ───────────────────────────────────────────────────────────────────────

.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}
  rules:
    - exists:
        - "**/*.csproj"
        - "**/*.sln"
        - "**/*.slnx"

lint:dotnet:
  extends: .dotnet
  stage: lint
  script:
    - dotnet format --verify-no-changes

build:dotnet:
  extends: .dotnet
  stage: build
  script:
    - dotnet build --configuration Release

test:dotnet:
  extends: .dotnet
  stage: test
  script:
    - dotnet test --configuration Release

# Source-level security scans (SAST, secrets, dependencies). They run in the
# security-scan stage, after lint/build/test/docker-build. Each job exits non-zero
# when it finds something; none of them swallows its exit code. Set
# allow_failure: true on a job in your own .gitlab-ci.yml if you want it advisory.
# The container image scan lives in docker-build-and-push.yml because it needs
# the image that job pushed.
#
# Switches: SECURITY_SCAN_ENABLED (all), SAST_ENABLED, SECRET_DETECTION_ENABLED,
# DEPENDENCY_SCAN_ENABLED, each "true" or "false".
#
# Note: only Semgrep writes a report in a format GitLab understands (--gitlab-sast).
# The other tools print their findings in the job log. For the merge request
# security widget use GitLab's own templates instead, e.g.
#   include: [{template: Jobs/Secret-Detection.gitlab-ci.yml}]

sast:semgrep:
  stage: security-scan
  image:
    name: semgrep/semgrep:1.182.0
    entrypoint: [""]
  script:
    - semgrep scan --config p/default --metrics=off --error --gitlab-sast --output gl-sast-report.json .
  artifacts:
    reports:
      sast: gl-sast-report.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false" || $SAST_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

secret-detection:gitleaks:
  stage: security-scan
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --no-banner --redact --report-format json --report-path gitleaks-report.json .
  artifacts:
    paths:
      - gitleaks-report.json
    expire_in: 1 week
    when: always
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false" || $SECRET_DETECTION_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# Trivy reads package-lock.json, yarn.lock, pnpm-lock.yaml, requirements.txt,
# poetry.lock, go.mod, pom.xml, gradle lockfiles, composer.lock, Cargo.lock and
# *.csproj/packages.lock.json, so one job covers every language in this pipeline.
dependency-scan:trivy:
  stage: security-scan
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false" || $DEPENDENCY_SCAN_ENABLED == "false"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# Build the image, push it to the project registry, then scan the pushed image.
# Needs a runner that can start the docker:dind service (privileged executor).
#
# The job runs on branches and tags when a Dockerfile exists (DOCKER_BUILD_ENABLED
# "auto"), always when it is "true" (custom DOCKERFILE_PATH), never when "false".
# Tags pushed: <registry image>:<short sha>, plus <registry image>:<git tag> on tag
# pipelines. There is no implicit :latest.

.docker-job-rules:
  rules:
    - if: '$DOCKER_BUILD_ENABLED == "false"'
      when: never
    - if: '$DOCKER_BUILD_ENABLED == "true" && ($CI_COMMIT_BRANCH || $CI_COMMIT_TAG)'
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
      exists:
        - Dockerfile

docker-build-and-push:
  stage: docker-build
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      IMAGE="${DOCKER_IMAGE:-$CI_REGISTRY_IMAGE}"
      docker build ${DOCKER_BUILD_ARGS} \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        -f "$DOCKERFILE_PATH" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" "$DOCKER_BUILD_CONTEXT"
      docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi
      echo "BUILT_IMAGE=$IMAGE:$CI_COMMIT_SHORT_SHA" > build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day
  rules:
    - !reference [.docker-job-rules, rules]

# Scans the image pushed above (needs its dotenv artifact), so it can never look at
# an image that does not exist yet.
container-scan:trivy:
  stage: security-scan
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  needs:
    - job: docker-build-and-push
      artifacts: true
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress "$BUILT_IMAGE"
  rules:
    - if: '$SECURITY_SCAN_ENABLED == "false" || $CONTAINER_SCAN_ENABLED == "false"'
      when: never
    - !reference [.docker-job-rules, rules]

# Deploy jobs, one per target, selected with DEPLOY_TARGET. This is the single
# deploy path of the pipeline: a job runs only on the default branch, never on a
# merge request or feature branch, and `resource_group` serialises deploys so two
# pipelines cannot deploy at once. Targets: docker-compose, rsync, s3, k8s, helm.
#
# Secrets come from masked + protected CI/CD variables, never from this repo:
#   SSH targets   DEPLOY_SSH_PRIVATE_KEY, DEPLOY_KNOWN_HOSTS (pinned host key, no ssh-keyscan at deploy time)
#   s3            AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, or an OIDC role through `id_tokens`
#   k8s, helm     KUBECONFIG as a variable of type "File"
#
# Every image whose entrypoint is the tool itself overrides it with entrypoint: [""]
# so the runner can start its own shell.

.deploy:
  stage: deploy
  resource_group: production
  environment:
    name: production

.ssh-deploy:
  extends: .deploy
  image: alpine:3.24
  before_script:
    - apk add --no-cache openssh-client rsync
    - |
      if [ -z "${DEPLOY_SSH_PRIVATE_KEY:-}" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ]; then
        echo "Set DEPLOY_HOST, DEPLOY_KNOWN_HOSTS and DEPLOY_SSH_PRIVATE_KEY" >&2
        exit 1
      fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

deploy:docker-compose-over-ssh:
  extends: .ssh-deploy
  script:
    - |
      ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
        "cd '$DEPLOY_PATH' && export IMAGE_TAG='$CI_COMMIT_SHORT_SHA' && docker compose pull && docker compose up -d --remove-orphans"
  rules:
    - if: '$DEPLOY_TARGET == "docker-compose" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:rsync-over-ssh:
  extends: .ssh-deploy
  script:
    - rsync -az -e "ssh -p $DEPLOY_PORT" "$DEPLOY_RSYNC_SOURCE" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
  rules:
    - if: '$DEPLOY_TARGET == "rsync" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:s3-sync:
  extends: .deploy
  image:
    name: amazon/aws-cli:2.38.5
    entrypoint: [""]
  script:
    - |
      : "${S3_BUCKET:?set S3_BUCKET}"
      aws s3 sync "$S3_SOURCE" "s3://$S3_BUCKET/" --delete
      if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
        aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
      fi
  rules:
    - if: '$DEPLOY_TARGET == "s3" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:k8s-set-image:
  extends: .deploy
  image:
    name: alpine/k8s:1.37.1
    entrypoint: [""]
  script:
    - |
      : "${K8S_DEPLOYMENT:?set K8S_DEPLOYMENT}"
      IMAGE="${DOCKER_IMAGE:-$CI_REGISTRY_IMAGE}:$CI_COMMIT_SHORT_SHA"
      kubectl set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE" -n "$K8S_NAMESPACE"
      kubectl rollout status "deployment/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout="${DEPLOY_TIMEOUT}s"
  rules:
    - if: '$DEPLOY_TARGET == "k8s" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:helm-upgrade-install:
  extends: .deploy
  image:
    name: alpine/helm:4.3.1
    entrypoint: [""]
  script:
    - |
      : "${HELM_RELEASE:?set HELM_RELEASE}"
      helm upgrade --install "$HELM_RELEASE" "$HELM_CHART" \
        --namespace "$HELM_NAMESPACE" --create-namespace \
        --set "image.repository=${DOCKER_IMAGE:-$CI_REGISTRY_IMAGE}" \
        --set "image.tag=$CI_COMMIT_SHORT_SHA" \
        --atomic --timeout "${DEPLOY_TIMEOUT}s"
  rules:
    - if: '$DEPLOY_TARGET == "helm" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
